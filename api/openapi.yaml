openapi: 3.1.0

info:
  title: CloFin Core API
  version: 0.1.0
  summary: Enterprise payments, ledger and reconciliation core.
  description: |
    CloFin is an open-source reference implementation of enterprise payment
    initiation, double-entry ledger, settlement and reconciliation.

    **Scope and limitations.** CloFin operates on synthetic data only. It is
    not connected to any bank, payment scheme or central bank, holds no
    regulatory authorisation of any kind, and never processes real funds.

    **Contract discipline.** This document is the interface specification, not
    generated documentation. It changes in the same commit as the handler it
    describes, and a contract test asserts that every operation declared here
    exists in the service's route table and vice versa.
  license:
    name: EPL-2.0
    identifier: EPL-2.0

servers:
  - url: http://localhost:8080
    description: Local development stack (docker compose)

tags:
  - name: Operations
    description: Liveness, readiness and service description.
  - name: Organisations
    description: Synthetic tenants. Every business record belongs to one.
  - name: Ledger
    description: |
      Ledger accounts and the double-entry journal.

      **Balances are derived, never stored.** Every balance in these responses
      is aggregated from journal lines at read time; there is no balance column
      in the schema and no cached figure being returned. A balance that
      disagrees with the movements that produced it is not a state this API can
      represent.

      **Authorisation is not implemented yet.** Until it is, an operation acts
      on the organisation named in the request — `organisationId` in the body of
      a write, or the `organisationId` query parameter on a read. It is not
      derived from an authenticated principal, because there is not one. Do not
      read the tenancy scoping in these operations as an access control.
  - name: Payments
    description: |
      Payment instructions: intent to pay, with a lifecycle.

      **An instruction is not a journal entry.** The instruction is the
      request; the entry is the accounting fact. One instruction produces
      several entries over its life — a release, a fee, a settlement.

      **Every mutating operation requires an `Idempotency-Key`.** A retry
      carrying the same key and the same body returns the stored response and
      performs no new work; the same key with a *different* body is `409`. A
      request with no key at all is `400`. This is the control that stops a
      timeout on submission from becoming a payment made twice.

      **Approval, settlement and screening are not implemented.** `submit`
      moves an instruction to `pendingApproval` and stops there — there is no
      approve operation, because approval by whoever submitted the payment
      would not be a control. `released`, `settled`, `failed` and `returned`
      exist in the lifecycle and no operation here drives an instruction into
      them.

      **Authorisation is not implemented yet**, exactly as for Ledger above.
      `createdBy` is taken from the request body. It records what a caller
      claimed, and is not evidence of who did anything.

paths:
  /:
    get:
      tags: [Operations]
      operationId: getServiceInfo
      summary: Service description and scope disclaimer
      description: |
        Identifies the service to anyone who reaches it without context, and
        states plainly what it is not. Unauthenticated by design.
      responses:
        "200":
          description: Service description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"

  /healthz:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Liveness probe
      description: |
        Answers whenever the process can serve a request. It deliberately does
        not check external dependencies: a liveness probe that fails because a
        database is briefly unavailable turns a recoverable blip into a restart
        loop.
      responses:
        "200":
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Readiness probe, including database reachability
      description: |
        Answers whether the service should receive traffic. Reports the applied
        schema version, which is the first thing anyone asks during an incident.
      responses:
        "200":
          description: Ready to receive traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Not ready — a dependency is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /organisations:
    post:
      tags: [Organisations]
      operationId: createOrganisation
      summary: Register a synthetic organisation
      description: |
        Creates a tenant. The identifier is generated by the service; a caller
        cannot supply one. Short names are unique case-insensitively, because
        two tenants distinguishable only by capitalisation would be
        indistinguishable in every export they appear in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganisationRequest"
      responses:
        "201":
          description: Organisation registered
          headers:
            Location:
              description: URI of the created organisation.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An organisation with this short name already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /organisations/{id}:
    get:
      tags: [Organisations]
      operationId: getOrganisation
      summary: Retrieve an organisation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts:
    post:
      tags: [Ledger]
      operationId: createAccount
      summary: Open a ledger account
      description: |
        Accounts are always created `active`. There is no way to open one
        frozen or closed: an account nobody can post to is not something a
        caller means to ask for.

        The account `type` determines the normal balance side, and therefore
        how debits and credits combine into a balance a finance team would
        recognise. It cannot be changed afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account opened
          headers:
            Location:
              description: |
                URI of the created account, including the `organisationId`
                query parameter needed to retrieve it.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account with this code already exists in this organisation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

    get:
      tags: [Ledger]
      operationId: listAccounts
      summary: List an organisation's chart of accounts
      description: |
        Ordered by account code. Returns at most `limit` accounts — see
        `movementCap` on the statement operation for the rationale. Real
        pagination is deferred until there is a consumer that needs it.
      parameters:
        - $ref: "#/components/parameters/OrganisationId"
      responses:
        "200":
          description: The chart of accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /accounts/{id}:
    get:
      tags: [Ledger]
      operationId: getAccount
      summary: Retrieve a ledger account
      description: |
        Scoped by organisation. An account belonging to another organisation is
        reported as `404`, the same answer a non-existent id receives —
        confirming that an id exists and belongs to someone else would be a
        tenancy disclosure available to anyone able to guess a UUID.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OrganisationId"
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{id}/statement:
    get:
      tags: [Ledger]
      operationId: getAccountStatement
      summary: Produce an account statement for a period
      description: |
        Opening balance, movements and closing balance, every figure derived
        from the journal.

        **The period is half-open: `from` is included, `to` is not.** A
        movement belongs to the period when `from <= occurredAt < to`.
        Consecutive periods therefore chain exactly — the closing balance of
        `[t1, t2)` is the opening balance of `[t2, t3)` — with no movement
        counted twice and none lost. To cover the whole of August, pass
        `from=2026-08-01T00:00:00Z` and `to=2026-09-01T00:00:00Z`.

        **`closingBalance` is authoritative even when `truncated` is true.** It
        is aggregated over the whole journal rather than summed from the
        movements returned. When `truncated` is false — the ordinary case —
        `openingBalance` plus the movements equals `closingBalance`, and the
        last movement's `runningBalance` equals `closingBalance`. When it is
        true, the response carries the earliest `movementCap` movements and the
        last `runningBalance` is *not* a closing figure; narrow the period
        instead. See ADR-0011.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OrganisationId"
        - name: from
          in: query
          required: true
          description: Start of the period, inclusive.
          schema: { type: string, format: date-time }
          examples:
            august: { value: "2026-08-01T00:00:00Z" }
        - name: to
          in: query
          required: true
          description: End of the period, **exclusive**.
          schema: { type: string, format: date-time }
          examples:
            august: { value: "2026-09-01T00:00:00Z" }
      responses:
        "200":
          description: The statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /journal-entries:
    post:
      tags: [Ledger]
      operationId: postJournalEntry
      summary: Post a balanced journal entry
      description: |
        Records one economic event. The entry and all of its lines are written
        in a single transaction: an entry either commits whole or does not
        exist.

        **Total debits must equal total credits, per currency.** An entry may
        span several currencies provided it balances within each. An entry that
        does not balance is `422`, and the `errors.imbalance` object names the
        shortfall for every currency that does not net to zero. Nothing is
        persisted.

        **Posted entries are immutable.** There is no update and no delete. A
        mistake is corrected by posting a reversing entry whose `reference.type`
        is `reversal` and whose `reference.id` is the original entry — both then
        remain visible, which is the point. An entry can be reversed at most
        once; a second attempt is `409`.

        The entry identifier is generated by the service. Idempotency keys are
        TASK-002 and apply to payment instructions rather than to raw entries;
        a retried request here posts a second entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostJournalEntryRequest"
      responses:
        "201":
          description: Entry posted
          headers:
            Location:
              description: |
                URI of the posted entry, including the `organisationId` query
                parameter needed to retrieve it.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: |
            The entry, or a reversal of the referenced entry, has already been
            posted.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            Understood, and cannot be carried out: the entry does not balance,
            or references an account that is frozen, closed, or not in this
            organisation. Nothing is persisted.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                unbalanced:
                  summary: Debits and credits do not agree
                  value:
                    type: "https://clofin.dev/problems/unprocessable"
                    title: "Request cannot be processed"
                    status: 422
                    detail: "Journal entry does not balance: total debits must equal total credits"
                    errors:
                      imbalance:
                        SGD: "250.00"

  /journal-entries/{id}:
    get:
      tags: [Ledger]
      operationId: getJournalEntry
      summary: Retrieve a posted journal entry
      description: |
        The resource a successful `POST /journal-entries` points its `Location`
        header at.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OrganisationId"
      responses:
        "200":
          description: The entry, with its lines in posting order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /payment-instructions:
    post:
      tags: [Payments]
      operationId: createPaymentInstruction
      summary: Capture a payment instruction
      description: |
        Records intent to pay. The instruction is created `draft`; a caller
        cannot choose the status, because an instruction arriving already
        approved would be an approval nobody gave.

        **Every failed field is named, not the first one.** A rejected request
        is `422` and its `errors` object carries one entry per field that
        failed, keyed by the member the caller sent. An operator correcting a
        rejected instruction should need one round trip, not one per mistake.

        **A reversal is created here too.** Pass `reversesId` naming a
        `settled` instruction and the result is a **new** instruction pointing
        back at it. The original is not modified — a settled payment is never
        mutated. Reversing anything that is not settled is `409`.

        *Not implemented:* a limit on the total reversed across several
        reversals of one instruction (PR-044). Nothing here stops a second
        reversal being raised against the same settled instruction.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentInstructionRequest"
      responses:
        "201":
          description: |
            Instruction captured, in status `draft`.

            Also the status of a **replayed** request: a replay returns the
            status the original call produced, so a retried creation is `201`
            and never `200`. `Idempotent-Replayed` is how the two are told
            apart, and the `Location` points at the instruction the original
            created rather than at a new one.
          headers:
            Location:
              description: |
                URI of the created instruction, including the `organisationId`
                query parameter needed to retrieve it.
              schema: { type: string }
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInstruction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          description: |
            Understood, and cannot be carried out: one or more fields were
            rejected, or the debtor account is frozen, closed, in another
            organisation, or holds a different currency. Nothing is persisted,
            and the `Idempotency-Key` is not consumed — retrying a corrected
            request under the same key executes normally.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                threeBadFields:
                  summary: Every failed field is named
                  value:
                    type: "https://clofin.dev/problems/validation"
                    title: "Request failed validation"
                    status: 422
                    detail: "Request failed validation"
                    errors:
                      amount: "must be greater than zero"
                      valueDate: "must not be in the past"
                      purposeCode: "unknown purpose code: XXXX"

    get:
      tags: [Payments]
      operationId: listPaymentInstructions
      summary: List an organisation's payment instructions
      description: |
        Most recently created first, then by id — a total order, so the same
        query over unchanged data returns the same page every time. Optionally
        filtered to one lifecycle state.

        Capped rather than paginated, for the reason given on the statement
        operation. `truncated` is stated on every response, not only when it is
        true.
      parameters:
        - $ref: "#/components/parameters/OrganisationId"
        - name: status
          in: query
          required: false
          description: Return only instructions in this lifecycle state.
          schema:
            $ref: "#/components/schemas/PaymentStatus"
      responses:
        "200":
          description: The instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInstructionList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /payment-instructions/{id}:
    get:
      tags: [Payments]
      operationId: getPaymentInstruction
      summary: Retrieve a payment instruction
      description: |
        Scoped by organisation. An instruction belonging to another
        organisation is `404`, the same answer a non-existent id receives.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OrganisationId"
      responses:
        "200":
          description: The instruction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInstruction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Payments]
      operationId: amendPaymentInstruction
      summary: Amend a draft payment instruction
      description: |
        **Only a draft may be amended.** An instruction that has been submitted
        is `409`: it is under consideration by someone else, and changing what
        they are considering underneath them is the failure segregation of
        duties exists to prevent (PR-004).

        Only substance is amendable. `id`, `organisationId`, `status`,
        `createdBy`, `createdAt` and `reversesId` are not, and naming one is
        `422` rather than being silently ignored — a caller that sent it
        believes it changed something.

        `organisationId` is required, and scopes the request rather than
        amending anything.

        *Not implemented:* PR-004 says a draft may be amended **by its
        creator**. There is no authenticated principal to check that against
        yet, and comparing a caller-supplied `createdBy` to a stored one would
        check that a UUID had been copied correctly while looking, from
        outside, like an access control. TASK-003 adds it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmendPaymentInstructionRequest"
      responses:
        "200":
          description: |
            The amended instruction. Also the status of a replayed request —
            see the `Idempotency-Key` parameter.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInstruction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The instruction is not a draft and cannot be amended, or the
            `Idempotency-Key` has already been used for a different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /payment-instructions/{id}/submission:
    post:
      tags: [Payments]
      operationId: submitPaymentInstruction
      summary: Submit a payment instruction for approval
      description: |
        Moves a `draft` to `pendingApproval`, and **stops there**. Approval is
        TASK-003; there is no operation in this contract that moves an
        instruction beyond `pendingApproval`, because a payment that could be
        approved by whoever submitted it is not a control.

        Submitting anything that is not a draft is `409`, naming the state the
        instruction is actually in and what would have been permitted from it.

        **This is the operation the `Idempotency-Key` exists for.** A timeout
        here leaves an operator unable to tell whether the payment went out;
        retrying with the same key answers that question without submitting
        twice. Two concurrent submissions of one instruction cannot both
        succeed — the row is locked for the duration of the state change.

        *Not implemented:* screening. `DOMAIN_MODEL.md` §3 rule 1 requires
        screening to have completed before submission. Increment 7 adds it;
        until then submission is gated by the lifecycle alone.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInstructionActionRequest"
      responses:
        "200":
          description: |
            The instruction, now `pendingApproval`. Also the status of a
            replayed request.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInstruction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The lifecycle does not permit `submit` from the instruction's
            current state, or the `Idempotency-Key` has already been used for a
            different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                alreadySubmitted:
                  summary: The state machine names what was attempted
                  value:
                    type: "https://clofin.dev/problems/conflict"
                    title: "Conflicting state"
                    status: 409
                    detail: "Cannot submit a payment instruction that is settled"
                    errors:
                      instruction-status: "settled"
                      attempted: "submit"
                      permitted: []

  /payment-instructions/{id}/cancellation:
    post:
      tags: [Payments]
      operationId: cancelPaymentInstruction
      summary: Cancel a payment instruction
      description: |
        Permitted from `draft` and from `approved`: an approved instruction
        that has not been released is still stoppable. Once released it is not,
        and the answer is `409` — value has left, and the correction is a
        reversal rather than a cancellation.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInstructionActionRequest"
      responses:
        "200":
          description: |
            The instruction, now `cancelled`. Also the status of a replayed
            request.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInstruction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The lifecycle does not permit `cancel` from the instruction's
            current state, or the `Idempotency-Key` has already been used for a
            different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  parameters:
    OrganisationId:
      name: organisationId
      in: query
      required: true
      description: |
        The organisation the request acts on. Supplied by the caller because
        authorisation does not exist yet — TASK-003 replaces this with the
        authenticated principal. It is not an access control.
      schema: { type: string, format: uuid }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A caller-supplied identifier that makes a retry safe. **Mandatory on
        every mutating operation** (PR-040); a request without one is `400`,
        rather than being quietly executed, because a caller that has not
        thought about retries is exactly the caller a retry will hurt.

        One key identifies one request. Replaying it with an identical body
        returns the stored response and performs no new work; replaying it with
        a different body is `409` and executes nothing. "Identical" is judged
        over a canonical form of the body, so a retry that differs only in
        whitespace or key order is honoured — that is a retry, not a conflict.

        Scoped to the organisation, so two tenants cannot collide. A request
        that failed does **not** consume its key: fix the body and retry with
        the same one.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        description: |
          Any non-blank string without control characters. A UUID is the
          obvious choice and nothing requires one.
        examples: ["b0c07f5e-6b5e-4f2f-9a1e-2f0d4a7c1e33"]

  responses:
    BadRequest:
      description: |
        The request could not be understood — a malformed identifier, a missing
        field, an amount that is not an integer.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource in this organisation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: |
        The request was understood and cannot be carried out. Distinct from
        `400`: this is a business outcome to show a human, not a bug in the
        caller.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IdempotencyConflict:
      description: |
        The `Idempotency-Key` has already been used for a **different** request
        body. Nothing was executed.

        This is not a failure to fix by retrying. Either resend the original
        request unchanged, or — if the change was intended — send it under a new
        key. Returning the stored response instead would tell a caller that an
        amount it never sent had been accepted; executing would be the second
        payment the key exists to prevent.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Money:
      type: object
      description: |
        A monetary amount as an integer count of the currency's minor units.
        Floating point is never used for money. The number of minor units in
        one major unit is 10^scale, where scale comes from ISO 4217 — it is not
        always 2. JPY and KRW have no minor unit; BHD, KWD and TND have three.
      required: [currency, minorUnits]
      additionalProperties: false
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 alphabetic code.
          examples: ["SGD"]
        minorUnits:
          type: integer
          format: int64
          description: Signed count of minor units.
          examples: [125000]
      examples:
        - { currency: "SGD", minorUnits: 125000 }
        - { currency: "JPY", minorUnits: 125000 }

    Organisation:
      type: object
      description: |
        A tenant of the platform. All synthetic — no real legal entity is
        represented anywhere in CloFin.
      required: [id, legalName, shortName, status]
      properties:
        id: { type: string, format: uuid }
        legalName:
          type: string
          examples: ["Meridian Freight Holdings Pte Ltd"]
        shortName:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,63}$"
          description: Unique case-insensitively; appears in exports and filenames.
          examples: ["meridian"]
        status:
          type: string
          enum: [active, suspended, closed]

    CreateOrganisationRequest:
      type: object
      required: [legalName, shortName]
      additionalProperties: false
      properties:
        legalName: { type: string, minLength: 1 }
        shortName:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,63}$"

    Account:
      type: object
      description: |
        A ledger account. `type` determines `normalBalance`, which is what turns
        a pile of debits and credits into a balance with a sign a finance team
        would recognise.
      required: [id, organisationId, code, name, type, currency, status, normalBalance]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        code:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{1,63}$"
          description: Unique within an organisation.
          examples: ["1100-CLIENT-FUNDS"]
        name: { type: string, examples: ["Client funds — pooled"] }
        type:
          type: string
          enum: [asset, liability, equity, revenue, expense]
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Every line posted to this account must be in this currency.
        status:
          type: string
          enum: [active, frozen, closed]
          description: |
            Only `active` accepts postings. A closed account is retained
            forever, because the entries referencing it are retained forever.
        normalBalance:
          type: string
          enum: [debit, credit]
          description: |
            Derived from `type`. The side on which this account carries a
            positive balance.

    CreateAccountRequest:
      type: object
      required: [organisationId, code, name, type, currency]
      additionalProperties: false
      properties:
        organisationId: { type: string, format: uuid }
        code:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{1,63}$"
        name: { type: string, minLength: 1 }
        type:
          type: string
          enum: [asset, liability, equity, revenue, expense]
        currency:
          type: string
          pattern: "^[A-Z]{3}$"

    AccountList:
      type: object
      required: [accounts, count, limit]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        count: { type: integer }
        limit:
          type: integer
          description: Maximum rows this operation returns.
          examples: [500]

    JournalLine:
      type: object
      description: |
        One side of a movement. Amounts are strictly positive — `direction`
        carries the sign, and a negative amount would be a second way to
        express the same thing.
      required: [accountId, direction, amount]
      additionalProperties: false
      properties:
        accountId: { type: string, format: uuid }
        direction:
          type: string
          enum: [debit, credit]
        amount:
          $ref: "#/components/schemas/Money"

    EntryReference:
      type: object
      description: |
        The business object that caused the entry. An entry with no reference is
        not permitted: every movement of money must be explainable by something
        that caused it.
      required: [type, id]
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - payment-instruction
            - settlement-item
            - reconciliation-adjustment
            - fee-assessment
            - fx-conversion
            - reversal
            - opening-balance
        id:
          type: string
          format: uuid
          description: |
            For `reversal`, the entry being reversed. That link is unique — an
            entry can be reversed at most once.

    JournalEntry:
      type: object
      required: [id, organisationId, occurredAt, narrative, reference, lines]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        occurredAt:
          type: string
          format: date-time
          description: When the economic event happened. Supplied by the caller.
        recordedAt:
          type: string
          format: date-time
          description: |
            When CloFin was told. Set by the service, and present when the entry
            has been read back from the journal.
        narrative: { type: string, examples: ["Opening balance"] }
        reference:
          $ref: "#/components/schemas/EntryReference"
        lines:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/JournalLine"

    PostJournalEntryRequest:
      type: object
      required: [organisationId, occurredAt, narrative, reference, lines]
      additionalProperties: false
      properties:
        organisationId: { type: string, format: uuid }
        occurredAt:
          type: string
          format: date-time
          description: Must carry a zone. A local time with no offset is rejected.
        narrative: { type: string, minLength: 1 }
        reference:
          $ref: "#/components/schemas/EntryReference"
        lines:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/JournalLine"

    Movement:
      type: object
      description: |
        One journal line as it appears on a statement, with the account's
        balance after it.
      required: [entryId, lineNo, occurredAt, narrative, direction, amount, runningBalance]
      properties:
        entryId: { type: string, format: uuid }
        lineNo:
          type: integer
          description: |
            Position within its entry. Present because an entry may touch the
            same account twice, and the two lines are otherwise identical.
        occurredAt: { type: string, format: date-time }
        narrative: { type: string }
        direction:
          type: string
          enum: [debit, credit]
        amount:
          $ref: "#/components/schemas/Money"
        runningBalance:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: |
            The account's balance after this movement, in the account's own
            terms — a positive liability balance means money is owed.

    Statement:
      type: object
      required: [account, from, to, openingBalance, closingBalance, movements, truncated, movementCap]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        from:
          type: string
          format: date-time
          description: Start of the period, inclusive.
        to:
          type: string
          format: date-time
          description: End of the period, exclusive.
        openingBalance:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Derived from every line strictly before `from`.
        closingBalance:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: |
            Derived from every line strictly before `to`. Aggregated over the
            whole journal, so it stays correct when `truncated` is true.
        movements:
          type: array
          description: |
            Ordered by occurrence, then by recording time, then by entry id and
            line number — a total order, so the same query over unchanged data
            produces the same document every time.
          items:
            $ref: "#/components/schemas/Movement"
        truncated:
          type: boolean
          description: |
            True when the period holds more than `movementCap` movements and
            the earliest `movementCap` were returned. The last `runningBalance`
            is then not a closing figure.
        movementCap:
          type: integer
          description: Maximum movements this operation returns.
          examples: [500]

    PaymentStatus:
      type: string
      description: |
        Where an instruction is in its lifecycle. The permitted moves between
        these are held as data in `clofin.payments.state/transitions` and are
        tested by enumerating every (state, event) pair — see
        `DOMAIN_MODEL.md` §3.

        `settled`, `rejected`, `cancelled`, `failed` and `returned` are
        terminal. A settled payment is never mutated; it is followed by a *new*
        reversal instruction.
      enum:
        - draft
        - pending-approval
        - approved
        - released
        - settled
        - rejected
        - cancelled
        - failed
        - returned

    PaymentEvent:
      type: string
      description: |
        A move an instruction may make. Only `submit` and `cancel` have an
        operation in this contract; the rest belong to approval (TASK-003) and
        settlement (increment 5), and are part of the model before they are
        part of the API.
      enum: [submit, cancel, approve, reject, amend, release, settle, fail, return]

    PurposeCode:
      type: string
      description: |
        Purpose of payment, from a constrained vocabulary. A synthetic subset
        of ISO 20022 `ExternalPurpose1Code`, chosen to cover the payment types
        CloFin models. It is **not** corridor-accurate: which codes a real
        scheme accepts, and which it mandates, differ by scheme and by
        jurisdiction, and CloFin is connected to neither.
      enum: [CASH, CHAR, DIVI, GDDS, INSU, INTC, LOAN, PENS, RENT, SALA, SCVE,
             SUPP, TAXS, TRAD, TREA]
      examples: ["SUPP"]

    PaymentInstruction:
      type: object
      description: |
        A request to move money. Mutable while `draft`; immutable in substance
        thereafter.

        Not a journal entry: this is the intent, and the entry is the
        accounting fact it eventually causes.
      required: [id, organisationId, debtorAccountId, creditorName,
                 creditorAccount, amount, valueDate, purposeCode, status,
                 createdBy, createdAt, permittedTransitions]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        debtorAccountId:
          type: string
          format: uuid
          description: |
            The ledger account the value comes from. Must be `active` and hold
            the instruction's currency.
        creditorName:
          type: string
          maxLength: 140
          description: |
            Synthetic. No counterparty named in CloFin corresponds to anything
            real. Bounded at ISO 20022's `Max140Text` so an instruction CloFin
            accepts is one a scheme message could carry.
          examples: ["Pacific Rim Logistics Pte Ltd"]
        creditorAccount:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{2,32}[A-Z0-9]$"
          description: |
            A synthetic external account identifier. It addresses nothing; the
            character set is deliberately narrower than any real scheme's.
          examples: ["SG-SYNTH-88012345"]
        amount:
          $ref: "#/components/schemas/Money"
        valueDate:
          type: string
          format: date
          description: |
            The date settlement is requested for. A calendar date, not an
            instant — a value date is the same day in every zone that quotes
            it. Must not be in the past, judged in UTC.
          examples: ["2026-08-10"]
        purposeCode:
          $ref: "#/components/schemas/PurposeCode"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        createdBy:
          type: string
          format: uuid
          description: |
            The actor the caller says created this. **Not evidence of who did
            anything** — there is no authenticated principal yet. TASK-003
            replaces it.
        createdAt: { type: string, format: date-time }
        reversesId:
          type: string
          format: uuid
          description: |
            Present only on a reversal, naming the settled instruction it was
            raised against. That instruction is unchanged.
        permittedTransitions:
          type: array
          description: |
            The events this instruction's current state allows, derived from
            the lifecycle table. A caller does not have to hold its own copy of
            the state machine to know what it may do next, and this list cannot
            advertise an operation the state machine would refuse. Empty on a
            terminal state.
          items:
            $ref: "#/components/schemas/PaymentEvent"

    CreatePaymentInstructionRequest:
      type: object
      required: [organisationId, debtorAccountId, creditorName, creditorAccount,
                 amount, valueDate, purposeCode, createdBy]
      additionalProperties: false
      properties:
        organisationId: { type: string, format: uuid }
        debtorAccountId: { type: string, format: uuid }
        creditorName: { type: string, minLength: 1, maxLength: 140 }
        creditorAccount:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{2,32}[A-Z0-9]$"
        amount:
          $ref: "#/components/schemas/Money"
        valueDate:
          type: string
          format: date
          description: |
            `YYYY-MM-DD`. Must not be in the past, and must be within 365 days
            — a warehoused payment is a real product; one dated four centuries
            out is a typo that would otherwise sit in `pendingApproval` forever,
            indistinguishable from work in progress.
        purposeCode:
          $ref: "#/components/schemas/PurposeCode"
        createdBy:
          type: string
          format: uuid
          description: Caller-asserted until TASK-003. See `PaymentInstruction.createdBy`.
        reversesId:
          type: string
          format: uuid
          description: |
            Set to raise this instruction as a reversal of a **settled** one.
            The result is a new instruction; the original is not modified.

    AmendPaymentInstructionRequest:
      type: object
      description: |
        A partial update of a draft. Only the members below may appear —
        anything else, including `status` and `createdBy`, is `422` rather than
        being ignored.
      required: [organisationId]
      additionalProperties: false
      properties:
        organisationId:
          type: string
          format: uuid
          description: Scopes the request. Not itself amendable.
        debtorAccountId: { type: string, format: uuid }
        creditorName: { type: string, minLength: 1, maxLength: 140 }
        creditorAccount:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{2,32}[A-Z0-9]$"
        amount:
          $ref: "#/components/schemas/Money"
        valueDate: { type: string, format: date }
        purposeCode:
          $ref: "#/components/schemas/PurposeCode"

    PaymentInstructionActionRequest:
      type: object
      description: |
        The body of a lifecycle operation. It carries the organisation because
        the idempotency key is scoped to one, and there is no authenticated
        principal to take it from.
      required: [organisationId]
      additionalProperties: false
      properties:
        organisationId: { type: string, format: uuid }

    PaymentInstructionList:
      type: object
      required: [paymentInstructions, count, limit, truncated]
      properties:
        paymentInstructions:
          type: array
          items:
            $ref: "#/components/schemas/PaymentInstruction"
        count: { type: integer }
        limit:
          type: integer
          description: Maximum rows this operation returns.
          examples: [500]
        truncated:
          type: boolean
          description: |
            True when there were more rows than `limit`. Stated on every
            response, not only when true: a consumer should not have to infer
            from the absence of a field that nothing was left out.

    ServiceInfo:
      type: object
      required: [service, description, environment, disclaimer]
      properties:
        service: { type: string, examples: ["clofin-core"] }
        description: { type: string }
        environment:
          type: string
          enum: [dev, test, prod]
        disclaimer:
          type: string
          description: Statement of scope — synthetic data, no institutional connectivity.
        documentation: { type: string, format: uri }

    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service: { type: string }
        uptimeSeconds: { type: integer, format: int64 }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, failed]
        schemaVersion:
          type: string
          description: Highest applied migration version, or "none".
          examples: ["0002"]

    Problem:
      type: object
      description: |
        RFC 9457 problem details. Payment APIs are consumed by systems that
        must branch on failure, so `type` is a stable URI that never changes
        meaning; `title` and `detail` are for humans and may be reworded.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ["https://clofin.dev/problems/validation"]
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance:
          type: string
          description: Correlation id — quote this when reporting a failure.
        errors:
          type: object
          description: Structured, machine-readable detail about what failed.
          additionalProperties: true

  headers:
    IdempotentReplayed:
      description: |
        `true` when this response was replayed from a stored one rather than
        produced by new work. Present only on a replay, so someone reconciling
        a retry can see that CloFin replayed rather than acted.
      schema:
        type: string
        enum: ["true"]

    XCorrelationId:
      description: |
        Correlation id echoed on every response. A caller-supplied value is
        honoured so that a trace survives across system boundaries; it is
        sanitised and length-limited before being echoed or logged.
      schema:
        type: string
        maxLength: 128
