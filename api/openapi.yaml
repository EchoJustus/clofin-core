openapi: 3.1.0

info:
  title: CloFin Core API
  version: 0.1.0
  summary: Enterprise payments, ledger and reconciliation core.
  description: |
    CloFin is an open-source reference implementation of enterprise payment
    initiation, double-entry ledger, settlement and reconciliation.

    **Scope and limitations.** CloFin operates on synthetic data only. It is
    not connected to any bank, payment scheme or central bank, holds no
    regulatory authorisation of any kind, and never processes real funds.

    **Contract discipline.** This document is the interface specification, not
    generated documentation. It changes in the same commit as the handler it
    describes, and a contract test asserts that every operation declared here
    exists in the service's route table and vice versa, that the published
    vocabularies equal the ones the service enforces, and that every
    actor-protected operation declares `X-Actor-Id` with its `401` and `403`
    responses.

    That test does **not** invoke a handler or validate request and response
    schemas against one, so this document's *semantics* are maintained by
    review rather than mechanically. Deep validation is named debt in
    `docs/COMPLIANCE.md` §4.

    **Browser clients.** A page served from another origin can read a CloFin
    response only if the deployment has named that origin in
    `CLOFIN_CORS_ALLOWED_ORIGINS`. Unset — the default, and what every
    deployment does unless someone decides otherwise — the service sends no
    CORS header of any kind and answers a preflight exactly as it answers any
    other unrouted `OPTIONS`, so a browser refuses the request. There is no
    wildcard setting and no origin is ever echoed back from the request.

    **CORS is not an access control**, and is not counted as one here: it
    governs what a *browser* will let a page read, and has no effect on any
    other client. Authorisation is `X-Actor-Id` and the permission each
    operation names, unchanged. See
    `docs/ADR/0027-browser-clients-cors-allowlist-and-instance-self-identification.md`.
  license:
    name: EPL-2.0
    identifier: EPL-2.0

servers:
  - url: http://localhost:8080
    description: Local development stack (docker compose)

tags:
  - name: Operations
    description: Liveness, readiness and service description.
  - name: Organisations
    description: Synthetic tenants. Every business record belongs to one.
  - name: Ledger
    description: |
      Ledger accounts and the double-entry journal.

      **Balances are derived, never stored.** Every balance in these responses
      is aggregated from journal lines at read time; there is no balance column
      in the schema and no cached figure being returned. A balance that
      disagrees with the movements that produced it is not a state this API can
      represent.

      **Authorisation applies here.** Opening an account and posting a journal
      entry are `controller` rights; reading accounts and entries is broader,
      because an operator who cannot see the chart of accounts cannot raise a
      payment against one. The organisation acted on comes from the
      authenticated actor — `organisationId` may still be sent and is
      *verified* against it, never trusted.
  - name: Approvals
    description: |
      Maker–checker. The actor who created a payment instruction can never
      approve it, the number of approvals required rises with the amount, and
      no approver may act beyond their own limit.

      **These are domain rules, not interface rules.** They are decided by a
      pure function that takes the instruction, the actor, the approvals
      already given and the organisation's threshold table, and returns a
      decision — with no database and no HTTP involved. This API reports that
      decision; it does not make it. A refusal always carries a machine-readable
      `errors.reason`, one of `selfApproval`, `notAnApprover`,
      `aboveActorLimit`, `alreadyApproved` or `noThresholdConfigured`
      (rendered in kebab-case), so a client branches on the control rather than
      on prose that may be reworded.

      **Rows an actor may not approve are shown in the queue, with the reason**,
      rather than hidden. A control implemented by hiding a row is not a
      control, and hiding would leave a maker unable to see that their own
      payment is waiting.

  - name: Settlement
    description: |
      Carrying approved payments through batching, release and a terminal
      outcome — against a **simulated** scheme.

      **CloFin is not connected to any bank, payment scheme or central bank.**
      Scheme identifiers are `SIM-` prefixed by a database constraint so that a
      synthetic record can never name a real network. Outcomes enter the system
      through `POST /settlement-batches/{id}/scheme-responses` and by no other
      route: there is no listener, no file drop and no correspondent.

      A batch's `status` is **derived** from its items' outcomes, never set
      directly — the same doctrine that makes a balance an aggregation over the
      journal rather than a column.

      The failure modes are the interesting part, and each has a defined
      answer. A duplicate response does no work and says so. A response for an
      item that already has an outcome is `409` — and its receipt is kept
      anyway, because a message that arrived is evidence whether or not CloFin
      could act on it. An item nobody answered about becomes `timed-out` when an
      operator sweeps — which means **unknown**, not failed: the payment stays
      `released`, and a late `timeout-resolution` says what really happened.

      **A settlement membership is permanent.** An instruction that has been in
      a batch is never batched again, whatever became of it — pending, settled,
      timed out and returned all block a second membership. A returned payment
      is terminal, exactly as a settled one is; the retry is a **new payment
      instruction**, approved on its own merits. That is a database constraint,
      not a check in a handler.

  - name: Reconciliation
    description: |
      Comparing what CloFin believes happened with a second, independent account
      of the same events — and turning every disagreement into a tracked, owned,
      ageing fact.

      **The statement format is CloFin's own.** `SIM-CLOFIN-RECON-STATEMENT`,
      versioned, `SIM-` prefixed, and deliberately **not** camt.053, MT940,
      BAI2 or any real scheme's or bank's schema. CloFin is a synthetic-data
      reference implementation connected to nothing; parsing a real bank format
      would be fidelity theatre, and naming one would invite exactly the
      misreading the scope statements exist to prevent. The only producer of a
      statement is CloFin's own simulator at `GET /settlement-statements`.

      **The two sides are produced by different things, on purpose.** The
      simulator builds a statement from the settlement records — what the
      scheme did, when it resolved each item, and the amount the instruction
      carried. The matcher compares it against the **journal**: posted amounts,
      entry occurrence dates, and the counter-account that says whether a
      movement was a settlement or a return. Nothing they agree about was
      derived from the other, which is the only arrangement under which
      agreement means anything.

      **Matching is deterministic, ordered and explainable.** Four rules, tried
      in a fixed sequence, first match wins, and every match records the rule
      that produced it. No scoring, no probabilities, no learning: a match
      nobody can re-derive is a match nobody can defend to an auditor. The rule
      order is published in `DOMAIN_MODEL.md` §6 and a guard compares that list
      with the code's in both directions.

      **The account being reconciled is `1300-IN-TRANSIT`**, CloFin's clearing
      account: at any instant it holds the value CloFin has released and does
      not yet know the fate of. A payment the scheme never answered about is
      correctly still in that balance *and* correctly absent from the statement
      — that pair is the case the whole model exists to show, not an edge case.

      **A break is a tracked object, not a discrepancy somebody will look at
      later.** It has a kind, an owner, a state (`open` → `investigating` →
      `resolved`) and an **age derived at read time** — never stored, because a
      stored age is wrong the moment it is written. Illegal transitions are
      refused with `409` naming what would have been permitted.

      **Nothing here edits a journal entry, ever.** The only way a disagreement
      changes the books is a new, balanced, approved entry posted through the
      same path a release takes. Above the lowest approval band the
      organisation configured for the currency it needs approvals from actors
      who are **not** the proposer; below it, one actor suffices, and an
      organisation that has configured no band in the currency cannot adjust at
      all — because treating "unconfigured" as "needs nobody" is how a control
      silently weakens.

      **No `Idempotency-Key`.** Replay protection here is the statement's own
      reference plus a canonical digest of every effect-bearing field it
      carries, which is stronger than a caller-chosen header: two callers
      delivering the same document under different keys are still one delivery.
      An exact re-delivery replays the original outcome; a different document
      under the same reference is `409`.

  - name: Screening
    description: |
      Sanctions screening (C-07): **core screens every submission itself**,
      against the one versioned synthetic list it has accepted, and a hit opens
      a case that a compliance actor — never the instruction's maker —
      dispositions with a retained rationale.

      **The list is synthetic and the matching is exact.** CloFin's list is
      CloFin-defined synthetic data, not derived from any real sanctions or
      watch list; a rule matches by string equality with no normalisation; and
      nothing in this API makes a claim about real-world screening quality. It
      builds the control's shape — a reproducible decision against a retained
      list version — not its quality.

      **A client's result is evidence, never authorisation** (ADR-0028 D5).
      `POST /payment-instructions/{id}/screening-results` records it beside
      core's recomputation against the same list version, refuses one core
      cannot reproduce — and keeps it, refused, as evidence — and transitions
      nothing. `submit` consults core's own decision only.

      **Every decision is reproducible from what is retained**: the list
      version (read it at `GET /screening-lists/{version}`), the instruction
      digest the decision was taken over (`screeningDigest`), the entries
      matched, the actor and the time.

      **No operation loads a list.** Lists are loaded by the operator's tool,
      exactly one accepted at a time; with none accepted, every submission is
      refused rather than screened against nothing.

  - name: Audit
    description: |
      The audit trail, and evidence extraction from it.

      **Every state change an operation here performs appends an event in the
      same transaction as the change itself**, so a rolled-back change leaves no
      event and a committed one leaves exactly one. An unaudited state change is
      not representable.

      There is **no qualification** on that statement. The one that stood until
      TASK-010 was a late `timeout-resolution` moving an **already-complete**
      settlement batch's derived status — `failed` to `settled`, say — which
      recorded the payment's own transition and left no event whose subject was
      the batch. That change now emits `settlement-batch.status-restated`, a
      term distinct from `settlement-batch.completed` because the two name
      different transitions: `completed` is the move *into* a complete batch,
      and this is a later correction of an outcome already reached. It is
      emitted only where the derived status actually moves.

      **Events carry digests, not payloads.** An event proves *that* something
      changed and — compared against a value the auditor already holds —
      *what* it changed to. It does not carry the counterparty name: an
      append-only table holding one is a second copy of the data being
      minimised, and it can never be cleaned. Each digest is prefixed with the
      canonicalisation version that produced it, so a later change to the
      canonical form cannot make two incomparable digests look comparable.

      The table rejects `UPDATE` and `DELETE` row by row and `TRUNCATE` per
      statement, at the database. Those triggers do not bind the table's
      *owner*, and CloFin connects as the owner in the shipped stack — the
      runtime role split that would close that is named debt in
      `COMPLIANCE.md` §4.

  - name: Payments
    description: |
      Payment instructions: intent to pay, with a lifecycle.

      **An instruction is not a journal entry.** The instruction is the
      request; the entry is the accounting fact. One instruction produces
      several entries over its life — a release, a fee, a settlement.

      **Every payment-instruction, approval and screening mutation requires an
      `Idempotency-Key`** — create, amend, submit, cancel, approve, withdraw,
      record a screening result and disposition a screening case.
      A retry carrying the same key and the same request returns the stored
      response and performs no new work; the same key with a *different*
      request is `409`. A request with no key at all is `400`. This is the
      control that stops a timeout on submission from becoming a payment made
      twice. Account creation, journal posting, organisation registration and
      the settlement operations do **not** take the header; settlement is
      guarded instead by batch lifecycle, permanent membership and the
      scheme-response replay key, and the three ledger and bootstrap writes
      expose no caller-key replay contract at all.

      **Screening, approval and settlement exist.** `submit` screens the
      instruction against the accepted synthetic list and, unless the hit
      stands, moves it to `pendingApproval` — and only its creator may do so — and
      `POST /payment-instructions/{id}/approvals` moves it on from there,
      refusing the actor named in `createdBy`. The two halves are one control:
      restricting submission to the creator is what makes refusing `createdBy` a
      complete maker–checker test.

      From `approved`, the **settlement operations drive the rest of the
      lifecycle**: submitting a batch releases every member (`released`), and a
      scheme response settles or returns each item (`settled`, `returned`).
      `failed` alone is reached by nothing — a scheme failure that sends the
      money back is a *return*, and an unanswered item is `timed-out`, which
      means unknown rather than failed. It is declared because the lifecycle
      carries the arrow, and its absence of a driver is stated in
      `DOMAIN_MODEL.md` rather than left to be discovered.

      **`createdBy` is the authenticated actor**, not a value the caller sends;
      a request that sets it is refused rather than quietly overridden. It is
      therefore evidence of who raised the payment, which is what makes it
      usable as the maker side of segregation of duties.

      **Amending is not only for drafts.** A `draft` is edited in place. A
      `pendingApproval` or `approved` instruction is returned to `draft` and
      **every approval given so far is invalidated** — an approver agreed to
      values that are no longer the instruction's.

paths:
  /:
    get:
      tags: [Operations]
      operationId: getServiceInfo
      summary: Service description and scope disclaimer
      description: |
        Identifies the service to anyone who reaches it without context, and
        states plainly what it is not. Unauthenticated by design.

        Includes `sourceCommit`, which is **self-reported by the running
        process, not attested** — see the field's own description.
      responses:
        "200":
          description: Service description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"

  /healthz:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Liveness probe
      description: |
        Answers whenever the process can serve a request. It deliberately does
        not check external dependencies: a liveness probe that fails because a
        database is briefly unavailable turns a recoverable blip into a restart
        loop.
      responses:
        "200":
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Readiness probe, including database reachability
      description: |
        Answers whether the service should receive traffic. Reports the applied
        schema version, which is the first thing anyone asks during an incident.
      responses:
        "200":
          description: Ready to receive traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Not ready — a dependency is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /organisations:
    post:
      tags: [Organisations]
      operationId: createOrganisation
      summary: Register a synthetic organisation
      description: |
        Creates a tenant. The identifier is generated by the service; a caller
        cannot supply one. Short names are unique case-insensitively, because
        two tenants distinguishable only by capitalisation would be
        indistinguishable in every export they appear in.

        **This is the only unauthenticated write in CloFin, and deliberately
        so.** An actor belongs to exactly one organisation, so no actor can
        exist before the first organisation does; requiring one here would mean
        a principal outside the tenancy model, which is the superuser the
        authorisation model exists to avoid.

        It follows that its audit event has no actor to record. The event is
        written — `organisation.created`, in the same transaction as the
        organisation itself — with a **null `actorId`**, meaning *there was no
        authenticated principal because none could exist yet*. No placeholder
        actor is invented for it. That null is the only one in the trail: an
        audit event for any other action is refused unless it names its actor.
        See ADR-0017.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganisationRequest"
      responses:
        "201":
          description: Organisation registered
          headers:
            Location:
              description: URI of the created organisation.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An organisation with this short name already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /organisations/{id}:
    get:
      tags: [Organisations]
      operationId: getOrganisation
      summary: Retrieve an organisation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: The organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts:
    post:
      tags: [Ledger]
      operationId: createAccount
      summary: Open a ledger account
      description: |
        Accounts are always created `active`. There is no way to open one
        frozen or closed: an account nobody can post to is not something a
        caller means to ask for.

        The account `type` determines the normal balance side, and therefore
        how debits and credits combine into a balance a finance team would
        recognise. It cannot be changed afterwards.

        A successful call appends one `account.created` audit event naming the
        authenticated actor, in the same transaction as the account itself — so
        a `409` or a `422` leaves neither the account nor an event behind. The
        event is visible through `GET /audit/events` and
        `GET /audit/evidence/{subjectId}`.
      parameters:
        - $ref: "#/components/parameters/ActorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account opened
          headers:
            Location:
              description: |
                URI of the created account, including the `organisationId`
                query parameter needed to retrieve it.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: An account with this code already exists in this organisation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

    get:
      tags: [Ledger]
      operationId: listAccounts
      summary: List an organisation's chart of accounts
      description: |
        Ordered by account code. Returns at most `limit` accounts — see
        `movementCap` on the statement operation for the rationale. Real
        pagination is deferred until there is a consumer that needs it.
      parameters:
        - $ref: "#/components/parameters/OrganisationId"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: The chart of accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /accounts/{id}:
    get:
      tags: [Ledger]
      operationId: getAccount
      summary: Retrieve a ledger account
      description: |
        Scoped by organisation. An account belonging to another organisation is
        reported as `404`, the same answer a non-existent id receives —
        confirming that an id exists and belongs to someone else would be a
        tenancy disclosure available to anyone able to guess a UUID.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OrganisationId"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{id}/statement:
    get:
      tags: [Ledger]
      operationId: getAccountStatement
      summary: Produce an account statement for a period
      description: |
        Opening balance, movements and closing balance, every figure derived
        from the journal.

        **The period is half-open: `from` is included, `to` is not.** A
        movement belongs to the period when `from <= occurredAt < to`.
        Consecutive periods therefore chain exactly — the closing balance of
        `[t1, t2)` is the opening balance of `[t2, t3)` — with no movement
        counted twice and none lost. To cover the whole of August, pass
        `from=2026-08-01T00:00:00Z` and `to=2026-09-01T00:00:00Z`.

        **`closingBalance` is authoritative even when `truncated` is true.** It
        is aggregated over the whole journal rather than summed from the
        movements returned. When `truncated` is false — the ordinary case —
        `openingBalance` plus the movements equals `closingBalance`, and the
        last movement's `runningBalance` equals `closingBalance`. When it is
        true, the response carries the earliest `movementCap` movements and the
        last `runningBalance` is *not* a closing figure; narrow the period
        instead. See ADR-0011.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OrganisationId"
        - name: from
          in: query
          required: true
          description: Start of the period, inclusive.
          schema: { type: string, format: date-time }
          examples:
            august: { value: "2026-08-01T00:00:00Z" }
        - name: to
          in: query
          required: true
          description: End of the period, **exclusive**.
          schema: { type: string, format: date-time }
          examples:
            august: { value: "2026-09-01T00:00:00Z" }
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: The statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /journal-entries:
    post:
      tags: [Ledger]
      operationId: postJournalEntry
      summary: Post a balanced journal entry
      description: |
        Records one economic event. The entry and all of its lines are written
        in a single transaction: an entry either commits whole or does not
        exist.

        **Total debits must equal total credits, per currency.** An entry may
        span several currencies provided it balances within each. An entry that
        does not balance is `422`, and the `errors.imbalance` object names the
        shortfall for every currency that does not net to zero. Nothing is
        persisted.

        **Posted entries are immutable.** There is no update and no delete. A
        mistake is corrected by posting a reversing entry whose `reference.type`
        is `reversal` and whose `reference.id` is the original entry — both then
        remain visible, which is the point. An entry can be reversed at most
        once; a second attempt is `409`.

        The entry identifier is generated by the service. Idempotency keys are
        TASK-002 and apply to payment instructions rather than to raw entries;
        a retried request here posts a second entry.

        A successful call appends one `journal-entry.posted` audit event —
        **one per entry, not one per line** — naming the authenticated actor, in
        the same transaction as the entry and its lines. Some of the entry's
        guarantees are enforced by deferred database constraints that are only
        judged at commit; if one of them refuses the entry, the audit event is
        rolled back with it, so there is never a record of a posting that did
        not happen. The event is visible through `GET /audit/events` and
        `GET /audit/evidence/{subjectId}`.
      parameters:
        - $ref: "#/components/parameters/ActorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostJournalEntryRequest"
      responses:
        "201":
          description: Entry posted
          headers:
            Location:
              description: |
                URI of the posted entry, including the `organisationId` query
                parameter needed to retrieve it.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            The entry, or a reversal of the referenced entry, has already been
            posted.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            Understood, and cannot be carried out: the entry does not balance,
            or references an account that is frozen, closed, or not in this
            organisation. Nothing is persisted.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                unbalanced:
                  summary: Debits and credits do not agree
                  value:
                    type: "https://clofin.dev/problems/unprocessable"
                    title: "Request cannot be processed"
                    status: 422
                    detail: "Journal entry does not balance: total debits must equal total credits"
                    errors:
                      imbalance:
                        SGD: "250.00"

  /journal-entries/{id}:
    get:
      tags: [Ledger]
      operationId: getJournalEntry
      summary: Retrieve a posted journal entry
      description: |
        The resource a successful `POST /journal-entries` points its `Location`
        header at.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OrganisationId"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: The entry, with its lines in posting order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payment-instructions:
    post:
      tags: [Payments]
      operationId: createPaymentInstruction
      summary: Capture a payment instruction
      description: |
        Records intent to pay. The instruction is created `draft`; a caller
        cannot choose the status, because an instruction arriving already
        approved would be an approval nobody gave.

        **Every failed field is named, not the first one.** A rejected request
        is `422` and its `errors` object carries one entry per field that
        failed, keyed by the member the caller sent. An operator correcting a
        rejected instruction should need one round trip, not one per mistake.

        **A reversal is created here too.** Pass `reversesId` naming a
        `settled` instruction and the result is a **new** instruction pointing
        back at it. The original is not modified — a settled payment is never
        mutated. Reversing anything that is not settled is `409`.

        **A retry likewise.** Pass `retriesId` naming a `returned` instruction
        and the result is a **new** instruction pointing back at it: a returned
        payment is terminal, and a second attempt is a second payment decision
        that is submitted and approved on its own merits. Retrying anything that
        is not returned is `409`. The two members are mutually exclusive.

        **A `clientReference` names at most one instruction per organisation**
        (ADR-0028 D6). A client that keeps its own identifier for a payment
        sends it here, and within the organisation:

        1. the same reference under the **same** `Idempotency-Key` with
           identical content is the ordinary replay — `201` and
           `Idempotent-Replayed: true`;
        2. the same reference under **any** key with different content is `409`
           with `errors.reason` = `client-reference-conflict`;
        3. the same reference with identical content under a **different** key
           is `409` with `errors.reason` = `client-reference-exists`.

        Both refusals name the existing instruction in `errors.instructionId`,
        persist nothing and do not consume the key: core never creates a second
        instruction for a reference it holds, so a lost key is resolved by the
        reference. "Identical content" is equality of `debtorAccountId`,
        `creditorName`, `creditorAccount`, `creditorCountry`, `amount`,
        `valueDate`, `purposeCode`, `reversesId` and `retriesId` with the
        existing instruction **as it is now** — one amended since its creation
        answers rule 2. Concurrent creations carrying one reference are decided
        by a unique index, and the one that loses is answered by the same rule.
        The same reference in another organisation is a different reference.

        **The order the answers are decided in:** authentication, the body's
        parse and the refusal of members a caller may not set (`createdBy`)
        come first; then the `Idempotency-Key` — its row is claimed before the
        creation runs, so the same key with a different body is the key's own
        `409` (`errors.header` = `Idempotency-Key`) whatever the reference says;
        then every field, all named at once (`422`); then the reference
        (`409`); then the rules that need the database — the link target's
        lifecycle (`409`), the debtor account (`422`).

        *Not implemented:* a limit on the total reversed across several
        reversals of one instruction (PR-044). Nothing here stops a second
        reversal being raised against the same settled instruction.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentInstructionRequest"
      responses:
        "201":
          description: |
            Instruction captured, in status `draft`.

            Also the status of a **replayed** request: a replay returns the
            status the original call produced, so a retried creation is `201`
            and never `200`. `Idempotent-Replayed` is how the two are told
            apart, and the `Location` points at the instruction the original
            created rather than at a new one.
          headers:
            Location:
              description: |
                URI of the created instruction, including the `organisationId`
                query parameter needed to retrieve it.
              schema: { type: string }
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInstruction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            One of the conflicts below, in the order they are decided; nothing
            was persisted under any of them.

            - The `Idempotency-Key` has already been used for a **different**
              request. `errors.header` is `Idempotency-Key`. Decided before the
              creation runs, because the key row is claimed first. Not a
              failure to fix by retrying: resend the original request unchanged,
              or send the changed one under a new key.
            - `errors.reason` = `client-reference-conflict`: this organisation
              already holds an instruction under this `clientReference`, with
              different content.
            - `errors.reason` = `client-reference-exists`: it holds one with
              identical content, created under a different key.

            - The lifecycle refuses the link: `reversesId` names an instruction
              that is not `settled`, or `retriesId` one that is not `returned`.
              The problem names the state and the event refused.

            The two reference reasons are `ClientReferenceRefusalReason`, and
            each names the existing instruction in `errors.instructionId`. No
            refusal here consumes the key: a corrected request under the same
            key executes normally.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                clientReferenceExists:
                  summary: The reference already names an instruction with this content
                  value:
                    type: "https://clofin.dev/problems/conflict"
                    title: "Conflicting state"
                    status: 409
                    errors:
                      reason: client-reference-exists
                      instructionId: "0000aaaa-0000-4000-8000-00000000a018"
        "422":
          description: |
            Understood, and cannot be carried out: one or more fields were
            rejected, or the debtor account is frozen, closed, in another
            organisation, or holds a different currency. Nothing is persisted,
            and the `Idempotency-Key` is not consumed — retrying a corrected
            request under the same key executes normally.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                threeBadFields:
                  summary: Every failed field is named
                  value:
                    type: "https://clofin.dev/problems/validation"
                    title: "Request failed validation"
                    status: 422
                    detail: "Request failed validation"
                    errors:
                      amount: "must be greater than zero"
                      valueDate: "must not be in the past"
                      purposeCode: "unknown purpose code: XXXX"

    get:
      tags: [Payments]
      operationId: listPaymentInstructions
      summary: List an organisation's payment instructions
      description: |
        Most recently created first, then by id — a total order, so the same
        query over unchanged data returns the same page every time. Optionally
        filtered to one lifecycle state.

        Capped rather than paginated, for the reason given on the statement
        operation. `truncated` is stated on every response, not only when it is
        true.
      parameters:
        - $ref: "#/components/parameters/OrganisationId"
        - name: status
          in: query
          required: false
          description: Return only instructions in this lifecycle state.
          schema:
            $ref: "#/components/schemas/PaymentStatus"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: The instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInstructionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /payment-instructions/by-idempotency-key/{key}:
    get:
      tags: [Payments]
      operationId: lookupPaymentInstructionByIdempotencyKey
      summary: What an idempotency key is bound to, and the instruction's status now
      description: |
        For a client that lost the answer to a creation (ADR-0028 D6). Answers
        with the response the creation stored — status and body, exactly as a
        replay would serve them — and the instruction's `status` now, read in
        the same request. Scoped to the caller's organisation.

        It reads the key table the write path binds inside the creating
        transaction, with no cache, so its answers mean exactly this:

        - **`200`** — a committed creation bound this key.
        - **`404`**, `errors.reason` = `no-binding` — **no committed binding
          existed at the instant of this read.** It does not prove that a
          creation still in flight cannot commit afterwards: that creation's key
          row is invisible until it does. Keep the original key, read again
          before deciding, and resubmit, if at all, under the **same** key —
          which turns a late commit into a replay rather than a second
          instruction.
        - **`409`**, `errors.reason` = `key-bound-to-another-operation` — the
          key is taken, but not by a creation; `errors.operationId` names the
          operation that bound it. A key row written before keys recorded their
          operation answers this too, with `errors.operationId` null — never
          `404`, which would tell a client to resubmit under a key that is taken.

        The key is a path segment: percent-encode it (RFC 3986). **Not every key
        the `Idempotency-Key` header accepts can be looked up here**, and the
        ones that cannot are refused rather than answered `404`:

        - **Only printable ASCII.** A key with any other character is `400` from
          the service: the transport reads a header's non-ASCII octets one
          character per octet, which no decoding of a path can be relied on to
          reproduce, so a lookup could only ever have reported such a key
          unbound.
        - **Not `/`, `%` or `\`, and not the keys `.` or `..`.** The HTTP
          transport refuses an encoded `/` (`%2F`), `%` (`%25`) or `\` (`%5C`),
          and a segment that is wholly `%2E` or `%2E%2E`, with its own `400`
          before the service sees the request — that `400` is the transport's,
          not a problem document — and a client that removes dot segments
          (RFC 3986 §5.2.4) turns an unencoded `.` or `..` into a different path.

        Any other printable-ASCII key — a space and `+` included, percent-encoded
        — is looked up exactly as the header carried it. A client that means to
        use this lookup chooses its keys accordingly; a UUID, the obvious choice,
        qualifies. A key the header could never have bound — blank once trimmed,
        over 255 characters, or containing a control character — is `400` from
        the service too.

        Retention of keys is the existing named debt: the lookup reads whatever
        rows exist.
      parameters:
        - name: key
          in: path
          required: true
          description: |
            The `Idempotency-Key` the creation was sent with, percent-encoded as
            a path segment.
          schema: { type: string, minLength: 1, maxLength: 255 }
        - $ref: "#/components/parameters/OrganisationId"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: The creation this key is bound to, and the instruction's status now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdempotencyKeyLookup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            `errors.reason` = `no-binding`, and `detail` carries the sentence the
            answer stands on: *No committed binding existed at the instant of
            this read; a creation still in flight may still commit — keep the
            original key, read again before deciding, and resubmit, if at all,
            under the same key.*
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            `errors.reason` = `key-bound-to-another-operation`, and
            `errors.operationId` the `operationId` that bound the key — or null
            for a row written before keys recorded their operation. The codes are
            `IdempotencyKeyLookupRefusalReason`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /payment-instructions/{id}:
    get:
      tags: [Payments]
      operationId: getPaymentInstruction
      summary: Retrieve a payment instruction
      description: |
        Scoped by organisation. An instruction belonging to another
        organisation is `404`, the same answer a non-existent id receives.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OrganisationId"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: The instruction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInstruction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Payments]
      operationId: amendPaymentInstruction
      summary: Amend a draft payment instruction
      description: |
        **A draft is edited in place; a `pendingApproval` or `approved`
        instruction is returned to `draft` and every approval given so far is
        invalidated** — an approver agreed to values that are no longer the
        instruction's, and the amendment restarts the maker–checker cycle
        rather than slipping past it. Each invalidation appends its own
        `approval.invalidated` event. Amending from any other state — `settled`,
        `released`, `cancelled`, `rejected`, `returned`, `failed` — is `409`.

        **Only the instruction's creator may amend it** (PR-004). Anyone else
        is `403` with `errors.rule` = `creator-only`, whatever permissions they
        hold, checked under the instruction's row lock in the same transaction
        as the change. The actor comes from `X-Actor-Id`; nothing compares a
        caller-supplied `createdBy`, which is why sending one is refused rather
        than trusted.

        Only substance is amendable, and `organisationId` is not substance.
        Sending it **asserts the tenant** — it is verified against the
        authenticated actor's own organisation and refused `403` if it differs,
        exactly as it is on every other body in this contract. It is accepted,
        it amends nothing, and a `PATCH` naming a matching one answers `200`.

        The members that are neither amendable nor a tenant assertion are
        `id`, `status`, `createdBy`, `createdAt`, `reversesId`, `retriesId` and
        `clientReference`; naming one of those is `422` rather than being
        silently ignored — a caller that sent it believes it changed something.
        `clientReference` is refused with its own reason — *is set when the
        instruction is created and cannot be amended* — and the database refuses
        a change to it from any writer, including adding one to an instruction
        created without it. `creditorCountry` is amendable, like the other
        beneficiary members.

        This paragraph listed `organisationId` among the `422` members until
        2026-09-06, which was false: the release audit's single authorised
        `PATCH` probe supplied a matching `organisationId` with a changed
        `creditorName` and was answered `200` (residual **C-R10a**). Refusing a
        tenant assertion the rest of the API requires would be the defect the
        sentence described.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmendPaymentInstructionRequest"
      responses:
        "200":
          description: |
            The amended instruction. Also the status of a replayed request —
            see the `Idempotency-Key` parameter.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInstruction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The actor is not this instruction's creator (PR-004), or does not
            hold `payment/amend`. `errors.rule` is `creator-only` in the first
            case.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The lifecycle does not permit `amend` from the instruction's current
            state — a `settled`, `cancelled`, `rejected` or `released`
            instruction cannot be amended — or the `Idempotency-Key` has already
            been used for a different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /payment-instructions/{id}/submission:
    post:
      tags: [Payments]
      operationId: submitPaymentInstruction
      summary: Submit a payment instruction for approval
      description: |
        Moves a `draft` to `pendingApproval`.

        **Only the actor named in `createdBy` may submit an instruction.**
        Anyone else is `403`, whatever permissions they hold, with
        `errors.rule` = `creator-only` — an answer distinct from a missing
        permission, because the remedy is not to be granted a role.

        That restriction is what makes maker–checker a control rather than a
        convention. The approvals operation refuses the actor named in
        `createdBy` and compares nothing else, so it is a complete test only
        while the submitter and the creator are the same actor. They need not
        have been until this restriction existed: an actor holding both
        `operator` and `approver` could submit somebody else's draft and then
        approve it.

        Submitting anything that is not a draft is `409`, naming the state the
        instruction is actually in and what would have been permitted from it.

        **This is the operation the `Idempotency-Key` exists for.** A timeout
        here leaves an operator unable to tell whether the payment went out;
        retrying with the same key answers that question without submitting
        twice. Two concurrent submissions of one instruction cannot both
        succeed — the row is locked for the duration of the state change.

        **Core screens every submission** (C-07, `DOMAIN_MODEL.md` §3 rule 1),
        against the one synthetic list it has accepted, in the same transaction
        and under the same row lock: core's result is stored with its
        `screening-result.recorded` event, and only then is the transition
        decided. A client's screening result is never consulted here.

        - No hit, or a hit a compliance actor dispositioned `false-positive` for
          this content against this list → `200`, `pendingApproval`.
        - A hit → **`409 screening-hit`**, `errors.caseId` naming the case
          (opened now if none was open on the instruction), `errors.listVersion`
          and `errors.resultId`; the instruction stays `draft`; and once a case
          has confirmed the hit, `errors.disposition: confirmed-hit` — the
          maker's path is then `cancel`. Core's result and the case are
          **stored**, and the `409` is rendered after they commit (they are the
          evidence of the refusal); the `Idempotency-Key` is bound to that
          answer, so a retry under it replays the `409`, and a submission after
          the disposition takes a new key.
        - No list accepted → `422 no-screening-list-accepted`. Nothing is
          stored and the key is not consumed: an unconfigured screen is not an
          unsupervised one.

        A refused submission writes **no** `payment.*` event. Screening runs at
        every submission: an amendment returns the instruction to `draft`, so
        the next submission screens the amended content again, and a
        disposition given on the old content does not carry over.

        The repository refuses `submit` itself — `409 screening-required` — when
        core holds no decision over the instruction's current content, whoever
        calls it; this operation always screens first, so it is that gate's
        second asking. The list is synthetic and the matching exact.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInstructionActionRequest"
      responses:
        "200":
          description: |
            The instruction, now `pendingApproval`. Also the status of a
            replayed request.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInstruction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The actor is not this instruction's creator, or does not hold
            `payment/submit`. `errors.rule` is `creator-only` in the first case,
            which a client should not retry by requesting a permission.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notTheCreator:
                  summary: Provenance, not permission
                  value:
                    type: "https://clofin.dev/problems/forbidden"
                    title: "Not permitted"
                    status: 403
                    detail: "Only the actor who created a payment instruction may submit it"
                    errors:
                      rule: "creator-only"
                      attempted: "submit"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The lifecycle does not permit `submit` from the instruction's
            current state, or the `Idempotency-Key` has already been used for a
            different request, or **core's screening found a hit that stands**
            — `errors.reason` `screening-hit` with `errors.caseId`,
            `errors.listVersion`, `errors.resultId` and, once confirmed,
            `errors.disposition` (`ScreeningRefusalReason`). Provenance is
            checked **first**, so a caller who is not the creator gets `403`
            rather than this — the instruction's state is not disclosed to an
            actor the operation is closed to — and the lifecycle second, so a
            submission that could never have been honoured screens nothing.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                screeningHit:
                  summary: Core's screening found a hit; a case is open
                  value:
                    type: "https://clofin.dev/problems/conflict"
                    title: "Conflicting state"
                    status: 409
                    detail: "Core's screening against list synthetic-2026-10-v1 found a hit; screening case 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d must be dispositioned false-positive by compliance before this content can be submitted"
                    errors:
                      reason: "screening-hit"
                      caseId: "9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d"
                      listVersion: "synthetic-2026-10-v1"
                      resultId: "1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e"
                alreadySubmitted:
                  summary: The state machine names what was attempted
                  value:
                    type: "https://clofin.dev/problems/conflict"
                    title: "Conflicting state"
                    status: 409
                    detail: "Cannot submit a payment instruction that is settled"
                    errors:
                      instruction-status: "settled"
                      attempted: "submit"
                      permitted: []
        "422":
          description: |
            No screening list is accepted — `errors.reason`
            `no-screening-list-accepted`. Nothing is stored, the instruction
            stays `draft`, and the key is not consumed; a list is loaded by the
            operator's tool, never through this API.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /payment-instructions/{id}/cancellation:
    post:
      tags: [Payments]
      operationId: cancelPaymentInstruction
      summary: Cancel a payment instruction
      description: |
        Permitted from `draft` and from `approved`: an approved instruction
        that has not been released is still stoppable. Once released it is not,
        and the answer is `409` — value has left, and the correction is a
        reversal rather than a cancellation.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInstructionActionRequest"
      responses:
        "200":
          description: |
            The instruction, now `cancelled`. Also the status of a replayed
            request.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInstruction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The lifecycle does not permit `cancel` from the instruction's
            current state, or the `Idempotency-Key` has already been used for a
            different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /payment-instructions/{id}/screening-results:
    post:
      tags: [Screening]
      operationId: recordScreeningResult
      summary: Record a client's screening result as evidence; transitions nothing
      description: |
        Records a screening result a **client** produced — `clear` or `hit` —
        as **evidence**, bound to the instruction's digest and to a list
        version core holds. Core **recomputes** the result against that list
        version and stores both the submitted and the recomputed outcome, with
        whether they agree (ADR-0028 D5).

        **A `201` means evidence recorded and nothing else.** No payment state
        has changed and no `payment.*` event has been written; neither the
        `201` nor its `auditEventId` may be translated into a transition
        acknowledgment. The only acknowledgment of a transition is the
        `PaymentInstruction` `submit` returns with `status: pendingApproval` —
        and `submit` consults **core's own** decision, made at that moment
        against the accepted list, never this one. Read the instruction back:
        its `status` is still `draft`.

        `screening/record`, held by the `screening-service` role. Its
        `X-Actor-Id` is configured identity, not a credential (ADR-0028 D8).

        **The order of the answers**, each asked only after the one before it
        has passed, under the instruction's row lock:

        1. `404` — the id is not an instruction of this organisation;
        2. `409` — the instruction is not a `draft` (evidence about a submitted
           instruction is evidence about a decision already taken), in the
           lifecycle's own shape with `errors.instruction-status`;
        3. `422 list-version-not-accepted` — `listVersion` is unknown or
           retired;
        4. `422 outcome-entries-inconsistent` — a `hit` naming no entries, or a
           `clear` naming some;
        5. `422 matched-entries-unknown` — an entry the version does not hold,
           or holds with other rules;
        6. `422 instruction-digest-mismatch` — `instructionDigest` is not the
           instruction's current `screeningDigest`;
        7. core recomputes. Equal outcome and equal entry-id set → `201`,
           stored `accepted`, `agrees: true`; an accepted `hit` opens a
           screening case unless one is open on the instruction, and `caseId`
           names it. Anything else → **`422 screening-result-mismatch`**, with
           `errors.coreOutcome` and `errors.coreMatchedEntries` — and the result
           **is stored**, `disposition: refused`, `agrees: false`, because the
           disagreement is evidence. Read it back at `GET /screening-results`.

        Answers 1–6 store nothing and leave the `Idempotency-Key` unconsumed.
        The `201` and the `422 screening-result-mismatch` both bind it: a retry
        under the same key replays the same answer rather than recording the
        same evidence twice.

        The list is synthetic and the matching exact; no part of this
        operation makes a claim about real-world screening quality.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreeningResultRequest"
      responses:
        "201":
          description: |
            Evidence recorded; the instruction's status is unchanged. Also the
            status of a replayed request.
          headers:
            Location:
              description: Where the instruction's screening results are read.
              schema: { type: string }
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The instruction is not a `draft` — `errors.instruction-status` names
            what it is — or the `Idempotency-Key` has already been used for a
            different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            Refused, with `errors.reason` from `ScreeningRefusalReason`:
            `list-version-not-accepted`, `outcome-entries-inconsistent`,
            `matched-entries-unknown` or `instruction-digest-mismatch`, each
            storing nothing; or `screening-result-mismatch`, which **is
            stored** as refused evidence and carries `errors.coreOutcome`,
            `errors.coreMatchedEntries` and `errors.resultId`. Also the status
            of a replayed mismatch.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                mismatch:
                  summary: Core could not reproduce the result — recorded, refused
                  value:
                    type: "https://clofin.dev/problems/unprocessable"
                    title: "Request cannot be processed"
                    status: 422
                    detail: "Core's screening of this instruction against synthetic-2026-10-v1 is hit (SYN-0001), which this result does not reproduce. The result is recorded as refused evidence; nothing else changed."
                    errors:
                      reason: "screening-result-mismatch"
                      resultId: "6f1c2d3e-4b5a-4c6d-8e7f-90a1b2c3d4e5"
                      coreOutcome: "hit"
                      coreMatchedEntries: ["SYN-0001"]

  /payment-instructions/{id}/approvals:
    post:
      tags: [Approvals]
      operationId: approvePaymentInstruction
      summary: Approve or reject a payment instruction
      description: |
        Records one actor's decision on one instruction, and moves the
        instruction on when that decision completes the requirement.

        **The actor who created the instruction is refused, always.** Not
        because a button is hidden — because the domain function that decides
        approvals refuses it, with no HTTP layer involved. That refusal cannot
        be resolved by granting a role or raising a limit, which is why it is
        reported in preference to every other reason when more than one
        applies.

        **How many approvals are required depends on the amount**, against the
        organisation's per-currency band table. `from` bounds are inclusive, so
        an amount exactly on a boundary falls in the higher band — the side
        that asks for more scrutiny. A first approval on a two-approval band
        returns `satisfied: false` and leaves the instruction `pendingApproval`,
        so an approver is never left guessing whether theirs was the last one
        needed. An organisation with no band covering the amount cannot have it
        approved at all: guessing a requirement is how a control silently
        weakens.

        **A rejection requires a reason**, which is retained. One rejection
        ends the instruction. A rejection is not bounded by the approver's
        limit — a ceiling is authority to permit a payment of a size, not to
        refuse one.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "201":
          description: |
            The decision as recorded, the instruction in whatever state it now
            holds, and the counting context. Also the status of a replayed
            request.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalOutcome"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The actor may not record this decision. `errors.reason` names which
            control refused it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                selfApproval:
                  summary: The maker cannot be the checker
                  value:
                    type: "https://clofin.dev/problems/forbidden"
                    title: "Not permitted"
                    status: 403
                    detail: "The actor who created this payment instruction may not approve it (segregation of duties)"
                    errors:
                      reason: "self-approval"
                aboveActorLimit:
                  summary: The amount exceeds this approver's own ceiling
                  value:
                    type: "https://clofin.dev/problems/forbidden"
                    title: "Not permitted"
                    status: 403
                    detail: "This payment instruction's amount is above this actor's approval limit"
                    errors:
                      reason: "above-actor-limit"
                      actor-limit-minor: 100000
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The lifecycle does not permit `approve` from the instruction's
            current state, the actor has already recorded a decision on it, or
            the `Idempotency-Key` has been used for a different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            Understood, and cannot be carried out: a rejection with no reason,
            or no approval threshold configured for the organisation and
            currency.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /payment-instructions/{id}/approvals/{approvalId}:
    delete:
      tags: [Approvals]
      operationId: withdrawApproval
      summary: Withdraw an approval already given
      description: |
        Marks an approval as no longer standing. **The record is not deleted** —
        `invalidatedAt` is set and the decision stays visible, because an
        approval that was given and then withdrawn is exactly the history an
        investigation needs. The database refuses a `DELETE` on the table in
        any case.

        Only the actor who gave an approval may withdraw it; otherwise the
        approval count would say nothing about who agreed to what. And only
        while the instruction is still `pendingApproval`: once the requirement
        is met the way back is to amend, which invalidates every approval and
        returns the instruction to `draft`. Unwinding an approved instruction
        one approval at a time would leave it approved with fewer approvals
        than its band requires.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: approvalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The approval, now invalidated, and the instruction.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                type: object
                required: [approval, paymentInstruction]
                properties:
                  approval:
                    $ref: "#/components/schemas/Approval"
                  paymentInstruction:
                    $ref: "#/components/schemas/PaymentInstruction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The instruction is no longer `pendingApproval`, or the approval has
            already been invalidated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /approvals/queue:
    get:
      tags: [Approvals]
      operationId: getApprovalQueue
      summary: List instructions awaiting approval with the context to decide them
      description: |
        Every instruction in the actor's organisation that is
        `pendingApproval`, each carrying what an approver needs in order to
        decide: the amount, the counterparty, the purpose, the approvals
        already given and how many more are required.

        A queue that showed only an id would push the approver into another
        system to find out what they were agreeing to, and an approval given
        without context is a rubber stamp.

        **Rows this actor may not approve are included**, with `canApprove:
        false` and a `refusalReason`. The reason is produced by the same
        function that would refuse the approval itself, so the queue does not
        hold a second copy of the rule.

        **Each row carries `screening`** — core's latest accepted screening
        decision over the instruction's *current* content: the result, its
        outcome, the list version and when (C-07, PR-015). Every instruction
        submitted since screening was built has one, because `submit` cannot
        succeed without it; the member is absent only for an instruction
        submitted before. An outcome of `hit` on a row here is a hit a
        compliance actor dispositioned `false-positive`.

        JSON, not a UI; the approval queue screen is a later increment.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalQueue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /screening-results:
    get:
      tags: [Screening]
      operationId: listScreeningResults
      summary: List a payment instruction's screening results, core's and clients'
      description: |
        Every screening result recorded against one instruction, newest first:
        core's own decision at each submission (`origin: core`) and every
        client's result (`origin: client`), accepted or refused — a refused
        result is stored precisely so that it can be read here.

        Addressed by query rather than as `GET /payment-instructions/{id}/screening-results`:
        a `GET` on a `/payment-instructions/{id}/<literal>` path can match the
        same request path as `GET /payment-instructions/by-idempotency-key/{key}`,
        and the service's route table holds itself to having no such pair, so
        that table order never decides a dispatch (017-REQ O-1).

        `screening/read`. An instruction of another organisation is `404`.
        Capped, with `truncated` stated on every response.
      parameters:
        - name: instructionId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
      responses:
        "200":
          description: The results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningResultList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /screening-cases:
    get:
      tags: [Screening]
      operationId: listScreeningCases
      summary: List an organisation's screening cases
      description: |
        Every screening case in the actor's organisation, newest first,
        optionally narrowed to one `status`. A case is a hit awaiting — or
        carrying — a compliance disposition. `screening/read`. Capped, with
        `truncated` stated on every response.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, dispositioned]
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
      responses:
        "200":
          description: The cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningCaseList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /screening-cases/{id}:
    get:
      tags: [Screening]
      operationId: getScreeningCase
      summary: Retrieve a screening case
      description: |
        One case: the instruction, digest and list version it is bound to, the
        result that opened it, and — once decided — its disposition, rationale,
        who gave it and when. `screening/read`; another organisation's case is
        `404`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningCase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /screening-cases/{id}/disposition:
    post:
      tags: [Screening]
      operationId: dispositionScreeningCase
      summary: Disposition a screening case as false-positive or confirmed-hit
      description: |
        Decides a hit: `false-positive` — the hit does not stand, and the
        instruction's next submission is permitted — or `confirmed-hit` — it
        stands, submission is refused, and the maker's path is cancellation.
        A `rationale` of 1–1000 characters, not blank, is required and
        retained.

        `screening/disposition`, held by `compliance` alone. **The
        instruction's creator is refused `403` with `errors.reason`
        `self-disposition`** whatever roles they hold — the maker never clears
        their own hit (C-01's shape). Asked before the case's status, so a
        maker learns nothing about the case from the refusal.

        A dispositioned case is `409`: a disposition is final, and the
        database refuses a second one from any writer as well.

        **A disposition is bound to the digest and list version the case
        names.** An amendment changes the instruction's digest, and a new list
        changes the version, and either makes the disposition moot: the next
        submission screens again and opens a new case if the hit stands.

        Audited as `screening-case.dispositioned`, with before and after
        digests, in the same transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreeningDispositionRequest"
      responses:
        "200":
          description: The case, now `dispositioned`. Also the status of a replayed request.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningCase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The actor does not hold `screening/disposition`, or created the
            instruction the case is about — `errors.reason`
            `self-disposition` — which no grant resolves.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                selfDisposition:
                  summary: The maker never clears their own hit
                  value:
                    type: "https://clofin.dev/problems/forbidden"
                    title: "Not permitted"
                    status: 403
                    detail: "The actor who created a payment instruction may not disposition its screening case: the maker never clears their own hit"
                    errors:
                      reason: "self-disposition"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The case is already dispositioned — `errors.case-status` names it
            and `errors.permitted` is empty — or the `Idempotency-Key` has
            already been used for a different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /screening-lists:
    get:
      tags: [Screening]
      operationId: listScreeningLists
      summary: List the synthetic screening list versions loaded
      description: |
        Every version of the **synthetic** screening list that has been loaded,
        newest first, with which one is accepted. At most one is accepted at a
        time; with none accepted, every submission is refused `422
        no-screening-list-accepted`.

        **Read-only. There is no operation that loads a list.** A list is
        loaded by the operator's tool (`make load-screening-list`), never by a
        client: a client that could load the list it is screened against would
        make the control unenforceable. Loading is a deployment act recorded by
        the list's own append-only rows (`loadedAt`, `source`), not by the
        tenant audit trail — a list belongs to no organisation.

        The list is CloFin-defined synthetic data with exact-match rules; it is
        not derived from any real list, and nothing here claims screening
        quality. `screening/read`.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
      responses:
        "200":
          description: The list versions.
          content:
            application/json:
              schema:
                type: object
                required: [screeningLists, count]
                additionalProperties: false
                properties:
                  screeningLists:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScreeningListSummary"
                  count: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /screening-lists/{version}:
    get:
      tags: [Screening]
      operationId: getScreeningList
      summary: Retrieve a synthetic screening list version with its entries
      description: |
        One version with every entry and rule, as it was loaded — the list a
        past decision names, and can be reproduced against. Retired versions
        remain readable: a decision's list is retained, unchanged, for as long
        as the decision is. `screening/read`.
      parameters:
        - name: version
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
      responses:
        "200":
          description: The list version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /settlement-batches:
    post:
      tags: [Settlement]
      operationId: createSettlementBatch
      summary: Group approved payment instructions into a settlement batch
      description: |
        Groups approved instructions for one **simulated** scheme, one currency
        and one value date. A batch is defined by that triple: an instruction
        whose currency or value date differs is refused, and so is one that is
        not `approved`.

        Every ineligible instruction is named in one refusal, with a reason
        each, rather than one at a time — an operator batching forty payments
        fixes them in one pass.

        An instruction that has **ever** been in a settlement batch is `409`.
        No outcome frees it: pending, settled, timed out and returned all block
        a second membership, because a timed-out item's true outcome is unknown
        and a returned one is terminal, and re-submitting either risks the
        duplicate settlement this module exists to prevent. The retry for a
        returned payment is a new payment instruction, approved on its own
        merits — the doctrine a settled payment already follows, where a
        correction is a new reversing instruction. That rule is a database
        constraint, not a check in a handler.

        Requires `settlement/execute`, which `controller` holds and no role
        holding `payment/approve` does.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSettlementBatchRequest"
      parameters:
        - $ref: "#/components/parameters/ActorId"
      responses:
        "201":
          description: Batch created, in status `open`.
          headers:
            Location:
              description: URI of the created batch.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: An instruction is already in a live settlement batch.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: One or more instructions cannot be settled in this batch.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      tags: [Settlement]
      operationId: listSettlementBatches
      summary: List an organisation's settlement batches
      description: |
        Most recent first, capped rather than paginated, with the cap and a
        `truncated` flag on every response. Requires `payment/read`: a
        settlement batch is a fact about payments, so an auditor who may read
        the payments may read how they settled.
      parameters:
        - name: status
          in: query
          required: false
          description: Restrict to one derived batch status.
          schema:
            type: string
            enum: [open, submitted, settled, partially-settled, failed]
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
      responses:
        "200":
          description: The organisation's settlement batches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementBatchList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /settlement-batches/{id}:
    get:
      tags: [Settlement]
      operationId: getSettlementBatch
      summary: Retrieve a settlement batch with its items and scheme responses
      description: |
        The batch, every membership and its outcome, the **exception cases**
        (returned items, with their reasons) as their own list, and every
        simulated scheme response recorded against the batch — including
        duplicates that were refused work, because the evidence that a duplicate
        arrived is the point of keeping them.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
      responses:
        "200":
          description: The settlement batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /settlement-batches/{id}/submit:
    post:
      tags: [Settlement]
      operationId: submitSettlementBatch
      summary: Release a settlement batch to its simulated scheme
      description: |
        In **one transaction**: every member moves `approved` to `released`,
        each posts its release entry to the journal, the batch moves `open` to
        `submitted`, and the audit trail gains one `payment.released` **and one
        `journal-entry.posted`** per instruction, plus one
        `settlement-batch.submitted` for the batch. A
        failure anywhere leaves the batch open, the instructions approved and
        the journal untouched.

        **A release posts.** Value moves out of pooled client funds and into
        settlement-in-transit, where an auditor can see it sitting mid-flight;
        finality moves that leg on. See ADR-0018.

        Eligibility is re-checked here under a row lock, not merely trusted from
        construction: an instruction amended or cancelled in between is no
        longer approved, and releasing it would release a payment nobody
        currently agrees to.

        Requires the organisation to hold `1100-CLIENT-FUNDS`,
        `1300-IN-TRANSIT` and `2100-CLIENT-PAYABLE` accounts in the batch's
        currency; a `422` names the missing ones.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: Batch submitted; every member released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The batch is not `open`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: A member is no longer eligible, or settlement accounts are missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /settlement-batches/{id}/scheme-responses:
    post:
      tags: [Settlement]
      operationId: recordSchemeResponse
      summary: Record a simulated scheme response against a settlement batch
      description: |
        **This is the simulation injection point.** CloFin is connected to no
        bank, payment scheme or central bank; there is no listener and no file
        drop. An outcome enters the system when a caller — a test, a UAT
        reviewer, or an operator demonstrating the controls — posts here, and by
        no other route.

        **The outcome is whatever the caller sends.** `kind` — and, for a
        `timeout-resolution`, `outcome` — decide what happens to the item; this
        operation validates their shape and applies them. Nothing here inspects
        the creditor account.

        What a simulated scheme *would* say is separately deterministic and
        predictable from the instruction, so a reviewer can produce partial
        failure on demand without inventing a script: `clofin.settlement.scheme`
        maps the **last digit of the synthetic creditor account** to a suggested
        outcome.

        | Last digit | Suggested outcome |
        |---|---|
        | `0`–`6` | settled |
        | `7`, `8` | returned |
        | `9` | no response at all — the item will time out |

        That table is **guidance for whoever composes the request**, not a
        constraint this operation enforces: a caller may post `settled` for an
        account ending `7` and it will settle. It was described as the
        derivation rule until the `ref-1` release audit (finding **A-013**),
        which is a contract a client could have built against and CloFin would
        not have honoured.

        Kinds:

        - `ack` — the batch was acknowledged. Recorded; moves nothing.
        - `settled` / `returned` — resolves one item, transitions its
          instruction, posts finality, and emits **two** audit events: one named
          after the transition (`payment.settled` / `payment.returned`) and one
          `journal-entry.posted` for the finality entry. A `returned` response
          must carry a `reason`.
        - `timeout-resolution` — the late answer for an item a sweep already
          gave up on. Must carry `outcome`, and resolves that item exactly once.

        **A duplicate delivery does no work.** The same
        `(instructionId, kind, reference)` carrying the same `outcome` and
        `reason` is answered `200` with `replayed: true`: no second posting, no
        second audit event, no second transition. A scheme answering twice,
        late, or out of order is the normal case in the world this simulates, so
        it is not reported as an error. The replayed body is the **original**
        answer, `outcome` included.

        **Identity is the reference; sameness is the whole message.** The
        reference names one delivery; whether two deliveries under it are the
        same message is decided by a canonical digest over the complete semantic
        request — batch, instruction, kind, reference, outcome and reason — the
        same posture `Idempotency-Key` takes. So a `timeout-resolution(settled)`
        and a `timeout-resolution(returned)` sharing one reference are two
        messages claiming one identity: that is `409`, and it is never described
        as a replay.

        **Every arrival is kept, including one CloFin cannot act on.** A
        response whose replay key is free but whose item is not in a state this
        kind can resolve is `409` — out of order, not a repeat — and its
        **receipt is committed first**, carrying `disposition: refused` and a
        machine-readable `dispositionReason`. Replaying that exact message
        reproduces the same refusal; it is not re-evaluated against state that
        has arrived since. The receipt is visible under `schemeResponses` on the
        batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemeResponseRequest"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: Response recorded. `replayed` is true when it was a duplicate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The item already has an outcome, is not timed out, is not in this
            batch, or this reference already names a different message.
            `errors.dispositionReason` names which case it was — the complete
            set of codes is `SchemeResponseRefusalReason` — and
            `errors.replayed` is true when this exact message has been refused
            before and is being given the same answer again.

            For the first three codes the response's **receipt has been
            committed before this status is rendered**, and is visible under
            `schemeResponses` on the batch. `replay-key-conflict` is the
            exception and writes nothing: the receipt it conflicts with is
            already there, and it is that receipt which stands as the evidence.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            Understood, and one named field is rejected on its own merits: a
            `returned` outcome with no reason. `settlement_return_needs_reason`
            guards the raw-SQL path behind it, but the modelled refusal is this
            one — it was emitted and undeclared until 2026-09-06 (release-audit
            finding **2C-010**).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /settlement-batches/{id}/timeout-sweep:
    post:
      tags: [Settlement]
      operationId: sweepSettlementTimeouts
      summary: Mark unanswered settlement items as timed out
      description: |
        An **explicit operator action**, not a background daemon: a timeout that
        fires itself is one nobody can point at afterwards, and a scheduler is
        operational machinery with no driver yet.

        Every item the batch is still waiting on, whose batch is older than
        `timeoutSeconds`, becomes `timed-out`.

        **Timed out means unknown, not failed.** The instruction stays
        `released` — no lifecycle event is driven, because CloFin does not know
        what happened to the money — and the item can never be re-batched. A
        late `timeout-resolution` is what says which of the two really happened;
        it resolves the item, and it does not free the instruction, because a
        settlement membership is permanent. Treating unknown as failed and
        re-batching is how a payment gets made twice.

        Running the sweep twice, or before the horizon, marks nothing and emits
        no audit event: nothing happened, so nothing is recorded as having
        happened.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeoutSweepRequest"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: The batch, with the instructions this sweep gave up on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The batch has not been submitted, so there is nothing to wait for.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /settlement-statements:
    get:
      tags: [Settlement]
      operationId: generateSimulatedStatement
      summary: Produce the simulated scheme's statement for a period
      description: |
        **The simulated scheme's own account statement**, computed from the
        settlement records of what it did. It writes nothing; the document it
        returns can be posted straight back to `POST /reconciliation-statements`,
        which is the whole walk a reviewer needs.

        The format is CloFin's own — `SIM-CLOFIN-RECON-STATEMENT`, versioned,
        `SIM-` prefixed — and is deliberately not camt.053, MT940, BAI2 or any
        real scheme's schema.

        A statement reports the outcomes the scheme actually **reached**:
        settlements and returns. A payment the scheme never answered about
        produces no line at all, which is the point rather than an omission —
        its value is still in `1300-IN-TRANSIT` on CloFin's books and correctly
        absent here.

        `perturbation` names one way the statement can be wrong. A generator
        that could only produce agreement could not test disagreement, and a
        *named* class lets a reviewer predict the break before running
        anything. Two identical requests produce byte-identical documents,
        including the `statementReference`, so re-ingesting one is a replay
        rather than a second document.

        Requires `payment/read`: a statement is a fact about payments that were
        settled, so whoever may read those may read this.
      parameters:
        - name: scheme
          in: query
          required: true
          description: The simulated scheme whose statement this is.
          schema:
            type: string
            enum: [SIM-RTGS, SIM-ACH]
        - name: currency
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CurrencyCode"
        - name: from
          in: query
          required: true
          description: Start of the period, inclusive.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: End of the period, exclusive.
          schema: { type: string, format: date-time }
        - name: perturbation
          in: query
          required: false
          description: |
            How to make the statement wrong. Defaults to `none`, which is the
            statement the simulation would really send.
          schema:
            $ref: "#/components/schemas/PerturbationClass"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
      responses:
        "200":
          description: The statement the simulated scheme would send.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatedStatement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            The period covers more settled items than one statement may report.
            Refused rather than truncated: a statement silently missing its tail
            would produce breaks against movements that are right there in the
            settlement record, and no caller could tell that from a real
            disagreement.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /reconciliation-statements:
    post:
      tags: [Reconciliation]
      operationId: ingestReconciliationStatement
      summary: Receive a synthetic statement and match it against the ledger
      description: |
        Receives one statement in CloFin's own format, matches every line
        against the movements CloFin's **journal** records on the reconciled
        account for the statement's period, and opens a break for every
        disagreement. Matching runs synchronously: this codebase has no job
        runner, and a background matcher is operational machinery with no driver
        yet.

        The account reconciled is `1300-IN-TRANSIT` in the statement's
        currency. An organisation without one is `422` — **and the statement is
        still recorded as having arrived**, with a machine-readable
        `dispositionReason`. Receipt and disposition are separate facts: a
        receipt destroyed by its own processing failure is not a receipt, and
        the refusal is rendered only after that receipt has committed.

        **Replay.** The statement's own `statementReference` is the delivery's
        identity within an organisation, and a canonical digest of every
        effect-bearing field it carries — scheme, currency, period and every
        line — says whether two deliveries under that identity are the same
        document. An exact re-delivery is `200` with `replayed: true` and does
        no work at all: no second match, no second break, no second audit event,
        and the body is the original answer. A *different* document under the
        same reference is `409` and is never called a replay.

        There is no `Idempotency-Key` header here, and that is deliberate: the
        document's own identity plus its digest is a stronger guarantee than a
        caller-chosen key, because two callers delivering the same document
        under different keys are still one delivery.

        Requires `reconciliation/execute`, which `controller` holds and no role
        holding `payment/approve` does.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestStatementRequest"
      parameters:
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: |
            The statement was received and matched. `replayed` is true when this
            exact document had already been delivered, in which case nothing was
            re-run and the answer is the original one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationStatement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            This organisation and statement reference already name a different
            document. The first receipt stands; nothing was written.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            The statement arrived and could not be processed — no
            `1300-IN-TRANSIT` account in its currency, or a period covering more
            ledger movements than one run may cover. **The receipt exists**;
            `errors.dispositionReason` says which.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /reconciliation-statements/{id}:
    get:
      tags: [Reconciliation]
      operationId: getReconciliationStatement
      summary: Retrieve a received statement with its matches and breaks
      description: |
        The statement as received, its lines, every match with **the rule that
        produced it**, and the breaks it opened. Requires
        `reconciliation/read`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
      responses:
        "200":
          description: The received statement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationStatement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /reconciliation-breaks:
    get:
      tags: [Reconciliation]
      operationId: listReconciliationBreaks
      summary: List reconciliation breaks, oldest first
      description: |
        **Oldest first** — the only list in this API ordered that way, and it is
        the product point rather than a preference: a break found in March may
        have originated in January, and a queue that buries the oldest item on
        page four is the spreadsheet this module replaces.

        Narrowed by state, kind, account or assignee. Capped rather than
        paginated, with the cap and a `truncated` flag on every response.
        Requires `reconciliation/read`.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BreakState"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BreakKind"
        - name: accountId
          in: query
          required: false
          description: Restrict to breaks on one reconciled account.
          schema: { type: string, format: uuid }
        - name: assigneeId
          in: query
          required: false
          description: Restrict to breaks owned by one actor.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
      responses:
        "200":
          description: The organisation's reconciliation breaks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationBreakList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reconciliation-breaks/{id}:
    get:
      tags: [Reconciliation]
      operationId: getReconciliationBreak
      summary: Retrieve a reconciliation break with its adjustments
      description: |
        One break — what disagreed, by how much, who owns it, how long it has
        been open — and every adjustment raised against it. Requires
        `reconciliation/read`, which `approver` holds: a checker who cannot read
        the adjustment they are being asked to approve is a rubber stamp.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
      responses:
        "200":
          description: The break and its adjustments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationBreakDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /reconciliation-breaks/{id}/assignment:
    post:
      tags: [Reconciliation]
      operationId: assignReconciliationBreak
      summary: Assign a reconciliation break to an actor
      description: |
        Gives a break an owner. Assigning an `open` break **is** the transition
        to `investigating` — a break becomes investigated by somebody taking it
        on, so ownership and state move together and leave one audit event.
        Assigning one that is already `investigating` is a reassignment and
        leaves the state where it is. A `resolved` break is `409`: who resolved
        what is history, and history is not reassigned.

        A break is never unowned. It opens assigned to the actor whose
        ingestion discovered it. Requires `reconciliation/execute`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignBreakRequest"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: The break, with its new owner and state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationBreak"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The break is not in a state that may be assigned. The problem names
            the state it is in and the transitions that would have been
            permitted.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: No such actor in this organisation to assign the break to.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /reconciliation-breaks/{id}/adjustments:
    post:
      tags: [Reconciliation]
      operationId: proposeReconciliationAdjustment
      summary: Propose an adjustment that resolves a reconciliation break
      description: |
        **Nothing in CloFin edits a journal entry, ever.** A disagreement
        changes the books through one route only: a new, balanced entry between
        the reconciled account (`1300-IN-TRANSIT`) and the suspense account
        (`2200-UNAPPLIED`), posted through the same path a release takes — the
        same zero-sum check, the same account lock, the same deferred database
        trigger, the same `journal-entry.posted` event.

        `direction` is the direction applied to the **reconciled** account; the
        suspense leg is always the opposite, so the entry balances by
        construction rather than by the caller getting it right. `narrative` is
        required: an entry that moves money between a clearing account and a
        suspense account without saying why is the entry an investigation will
        be least able to explain.

        **How many approvals it needs comes from the organisation's own
        `approval_threshold` bands** — the same table, per currency, that
        governs payments. Below the lowest band configured for the currency the
        proposer alone may post, and the adjustment posts in this call
        (`posted: true`). At or above it — the boundary is inclusive — the
        adjustment waits for that band's number of approvals from actors who are
        **not** its proposer. An organisation with no band in the currency is
        `422`: an unconfigured currency is not an unsupervised one.

        Requires `reconciliation/execute`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeAdjustmentRequest"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
      responses:
        "201":
          description: |
            The adjustment. `posted` says whether it also moved the books in
            this call, which happens exactly when it needed no approvals.
          headers:
            Location:
              description: URI of the break the adjustment resolves.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationAdjustment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The break is already resolved, or already has a posted adjustment.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            Understood, and the organisation is not set up for it: no approval
            band in the currency, no `2200-UNAPPLIED` account to post to, a
            currency that is not the break's, or a rejected field.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /reconciliation-adjustments/{id}:
    get:
      tags: [Reconciliation]
      operationId: getReconciliationAdjustment
      summary: Retrieve a reconciliation adjustment
      description: |
        One adjustment — what it proposes, how many approvals it needs, and what
        was decided about it. The same representation the break embeds, because
        a caller that follows a `Location` and a caller that reads the break
        must be told the same thing.

        This is where the `Location` of a proposal and of a decision points.
        Requires `reconciliation/read`, which `approver` holds, for the reason
        `getReconciliationBreak` gives.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
      responses:
        "200":
          description: The adjustment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationAdjustment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /reconciliation-adjustments/{id}/approvals:
    post:
      tags: [Reconciliation]
      operationId: approveReconciliationAdjustment
      summary: Decide a reconciliation adjustment, posting or refusing it
      description: |
        A second, **different** actor agrees — or refuses. This is the *same*
        maker–checker control that governs payment approvals — the same pure
        decision function, the same `approval` table, the same per-currency
        approver limits, the same refusal vocabulary, the same `decision`
        member — applied to a different subject. There is no second approval
        mechanism in CloFin.

        **`decision: rejected` ends the adjustment**, with a `reason` that is
        required rather than optional. The adjustment becomes terminal, an
        event whose subject is the adjustment records the refusal, and the
        break is left exactly as it was — proposing an adjustment never moved
        it — so a different adjustment may be raised against the same break.
        Until this existed an approver who disagreed simply did not answer, the
        proposal sat `proposed` for ever, and nothing recorded that anybody had
        considered it.

        The adjustment's proposer may neither approve nor reject it, and that
        refusal is evaluated **first** and is never waivable: an actor may be
        granted a role or a larger limit, but the maker never becomes a valid
        checker for their own correction.

        The number of approvals required is the one recorded on the adjustment
        **when it was proposed**, not the one the bands would give today. An
        organisation cannot lower a band and thereby post an adjustment that
        never cleared the bar it was raised under.

        When this approval completes the requirement, the entry posts and the
        break resolves **in the same transaction** — an approved-but-unposted
        adjustment is not a state that exists.

        No permission is checked at this boundary. The decision function checks
        `payment/approve` — or `payment/reject` — *and* the maker, the limit
        and the count, and it ranks those reasons deliberately: a boundary check
        would tell the adjustment's own proposer that fixing their permissions
        would help. A rejection is judged against neither the approver's ceiling
        nor the organisation's bands: saying no is not an exercise of spending
        authority.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveAdjustmentRequest"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
      responses:
        "201":
          description: |
            The decision, and what it did. `posted` is true when this approval
            completed the requirement and the entry was posted; `rejected` is
            true when this decision refused the adjustment. Never both.
          headers:
            Location:
              description: URI of the adjustment decided on.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentApprovalOutcome"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            Refused by the maker–checker control. `errors.reason` is one of
            `self-approval`, `not-an-approver` or `above-actor-limit`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            This actor has already decided on this adjustment, or the adjustment
            has already reached a terminal status — posted, or refused by
            somebody else.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            No approval band is configured for this organisation and currency,
            the organisation has no account to post the adjustment to, or a
            rejection arrived with no `reason`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /reconciliation-status:
    get:
      tags: [Reconciliation]
      operationId: getReconciliationStatus
      summary: Report reconciliation status for an account and period
      description: |
        Matched, unmatched and breaks by state, for one account over one period
        (PR-054).

        The period is half-open, `[from, to)`, and a statement belongs to it
        when **its own period lies inside** the requested one: a statement
        covering the last week of July and the first of August is not an August
        statement, and counting half of it would produce a figure that agrees
        with no document.

        Every figure is counted by the database over the rows themselves rather
        than assembled from a capped list, so the answer stays correct for a
        period whose breaks would not fit in one page. Every rule and every
        break kind appears with a zero rather than being absent, so a consumer
        reads "none of this kind" rather than having to distinguish that from
        "this build does not know this kind".

        `oldestUnresolvedAgeSeconds` is derived at read time and is null when
        nothing is outstanding — which is a different statement from zero.
        Requires `reconciliation/read`.
      parameters:
        - name: accountId
          in: query
          required: true
          description: The reconciled account — in practice `1300-IN-TRANSIT`.
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          description: Start of the period, inclusive.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: End of the period, exclusive.
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
      responses:
        "200":
          description: Reconciliation status for the account and period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /audit/events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: List an organisation's audit events
      description: |
        The audit trail, most recent first, narrowed by `action`, `subjectId`
        and a period.

        The period is **half-open** — `from` is included, `to` is not — the
        same convention the account statement uses, so consecutive extractions
        chain exactly rather than double-counting whatever landed on the
        boundary.

        Capped rather than paginated, with the cap and a `truncated` flag on
        every response. An audit answer that silently stopped at a limit would
        be the worst possible place for that to happen.

        Requires `audit/read`, which operators and approvers do not hold: an
        operator able to read the whole trail could see which approvers act on
        what and when, which is reconnaissance rather than transparency.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
        - name: action
          in: query
          required: false
          description: Restrict to one action from the audit vocabulary.
          schema:
            $ref: "#/components/schemas/AuditAction"
        - name: subjectId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          description: Inclusive start of the period, as an ISO 8601 instant.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Exclusive end of the period, as an ISO 8601 instant.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The matching events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /audit/evidence/{subjectId}:
    get:
      tags: [Audit]
      operationId: getEvidencePack
      summary: Extract a complete evidence pack for one subject
      description: |
        Every state change of one subject, in the order it happened, each entry
        carrying the actor who caused it. There are **eleven** kinds of subject:
        a payment instruction, an approval, an organisation, a ledger account,
        a journal entry, a settlement batch, reconciliation's three — a
        reconciliation statement, a reconciliation break and a reconciliation
        adjustment — and screening's two, a screening result and a
        screening case. The authoritative list is the `subjectType` enum on
        `AuditEvent` and `EvidencePack`, which the contract test compares with
        `clofin.audit/subject-types` in both directions.

        Screening's two joined in TASK-017; the count read "nine" until then.
        A case's pack is its opening and its disposition, in that order.

        This paragraph named six and omitted reconciliation's three from
        TASK-008 onward (known debt, 010-REQ N-3); corrected 2026-09-06.

        For a payment instruction **and for a reconciliation adjustment** the
        pack also includes the approvals' own events — `approval.recorded`,
        `approval.invalidated`, `approval.withdrawn` — even though those name
        the approval as their subject. Without them the pack cannot answer "who
        approved this, and what happened to their approval?", which is most of
        what an approval trail is for. The adjustment half was added
        2026-09-06: `approval` has named either subject since migration `0012`,
        and the extraction followed only the payment link, so an investigator
        starting from an adjustment could not reach the decision that decided
        it (release-audit finding **2C-012**).

        The pack **states its own boundaries** — the period it spans and
        whether it hit the row cap — so an auditor never has to infer
        completeness from the absence of a warning.

        A subject with no events is `404` rather than an empty pack. An
        evidence pack that is silently empty is worse than none at all, because
        it reads as proof that nothing happened.
      parameters:
        - name: subjectId
          in: path
          required: true
          description: >-
            The id of any audited subject: a payment instruction, an approval,
            an organisation, a ledger account, a journal entry, a settlement
            batch, a reconciliation statement, break or adjustment, or a
            screening result or case.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/OptionalOrganisationId"
      responses:
        "200":
          description: The evidence pack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePack"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    OrganisationId:
      name: organisationId
      in: query
      required: false
      description: |
        The organisation the caller believes it is acting for.

        **Verified, not trusted.** The organisation a request acts on comes
        from the authenticated actor's own record; this value, when sent, is
        compared against it and a mismatch is `403`. Refusing rather than
        ignoring matters: silently reinterpreting the request as being about
        the caller's own organisation would let a caller believe it had acted
        on another tenant's data and been told it succeeded.

        Optional. A caller that omits it gets its own organisation, which is
        the only one it could ever have acted on.
      schema: { type: string, format: uuid }

    OptionalOrganisationId:
      name: organisationId
      in: query
      required: false
      description: |
        Optional, and verified against the authenticated actor's organisation
        rather than trusted. See `OrganisationId`.
      schema: { type: string, format: uuid }

    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      description: |
        The actor this request acts as, resolved against the seeded `actor`
        table. Absent or unknown is `401`.

        **This is not authentication that resists an adversary, and it is not
        presented as such.** There is no identity provider, no token and no
        signature: anyone who can reach the service can claim to be any seeded
        actor. Identity-provider integration is deliberately out of scope — the
        permission *model* is the interesting part and provider wiring is
        plumbing.

        What it does deliver is a real principal with a real organisation and a
        real permission set, so that segregation of duties and least privilege
        are decided against an identity the application holds rather than one
        the request asserts. The organisation a request acts on, and the
        `createdBy` recorded against a payment, both come from here.

        There is no endpoint that creates an actor, grants a role or sets a
        limit. Actors are seeded: an actor that could grant itself the approver
        role would make segregation of duties unenforceable however carefully
        the rest of this is written. `POST /organisations` is the one
        unauthenticated operation, because there is no actor until an
        organisation exists to hold one.
      schema: { type: string, format: uuid }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A caller-supplied identifier that makes a retry safe. **Mandatory on
        every operation that declares this parameter** — the eight payment,
        approval and screening mutations: create, amend, submit, cancel,
        approve, withdraw, record a screening result and disposition a
        screening case.
        A request without one is `400` rather than being quietly executed,
        because a caller that has not thought about retries is exactly the
        caller a retry will hurt.

        PR-040 asks for it on every mutating operation and that is not yet true:
        organisation registration, account creation, journal posting and the
        four settlement operations do not take this header. Settlement is
        guarded instead by batch lifecycle, permanent membership and the
        scheme-response replay key; the three ledger and bootstrap writes expose
        no caller-key replay contract at all. The parameter list on each
        operation is authoritative, and this sentence exists because the
        requirement's wording was reproduced here as an enforcement claim
        (`ref-1` audit finding **A-005**).

        One key identifies one request. Replaying **the same request** returns
        the stored response and performs no new work; reusing the key for a
        different request is `409` and executes nothing.

        "The same request" means the same method, the same path *and* the same
        body. The path counts: two instructions' submissions carry identical
        bodies and differ only in their path, so a key that ignored it would
        make the second a replay of the first — and that instruction would never
        be submitted. Judged over a canonical form, so a retry differing only in
        whitespace or key order is honoured; that is a retry, not a conflict.

        Scoped to the organisation, so two tenants cannot collide. A request
        that failed does **not** consume its key: fix the body and retry with
        the same one. **Two refusals are the exception, because their evidence
        commits**: `submit`'s `409 screening-hit` stores core's screening result
        and the case it opened, and `recordScreeningResult`'s `422
        screening-result-mismatch` stores the refused result. Each binds the
        key to that refusal, so a retry under it replays the refusal rather than
        recording the evidence twice; a new attempt takes a new key.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        description: |
          Any non-blank string without control characters. A UUID is the
          obvious choice and nothing requires one.
        examples: ["b0c07f5e-6b5e-4f2f-9a1e-2f0d4a7c1e33"]

  responses:
    BadRequest:
      description: |
        The request could not be understood — a malformed identifier, a missing
        field, an amount that is not an integer.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource in this organisation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: |
        No `X-Actor-Id` header, or it names no actor. `401` rather than `404`
        for an unknown id: confirming which UUIDs name real actors would let
        anyone able to guess one enumerate the actor table.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        The actor is authenticated and may not do this. An absent permission is
        a denied permission; there is no implicit grant and no superuser role
        in the model.

        The missing permission is named. The permissions the actor *does* hold
        are not — that would turn a refusal into a capability listing.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: |
        The request was understood and cannot be carried out. Distinct from
        `400`: this is a business outcome to show a human, not a bug in the
        caller.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    CurrencyCode:
      type: string
      description: |
        A currency CloFin can represent, as an ISO 4217 alphabetic code.

        **The complete supported set**, not a shape. It was published as
        `pattern: "^[A-Z]{3}$"` until the `ref-1` release audit (finding
        **A-019**), which meant a contract-valid request naming `XYZ` was
        rejected by `clofin.money/of` or by a currency foreign key — a client
        could not derive the accepted set from the interface specification, and
        the specification described a system more permissive than the one that
        answers.

        The minor-unit scale is ISO 4217's and is **not** always 2: `JPY`,
        `KRW` and `VND` have no minor unit, and `BHD`, `KWD` and `TND` have
        three. `clofin.contract-test` compares this enum with
        `clofin.money/currencies` in both directions, so a currency added to
        one and not the other fails the build.
      enum:
        - AUD
        - BHD
        - CAD
        - CHF
        - CNY
        - EUR
        - GBP
        - HKD
        - IDR
        - INR
        - JPY
        - KRW
        - KWD
        - MYR
        - NZD
        - PHP
        - SGD
        - THB
        - TND
        - USD
        - VND
      examples: ["SGD"]

    Money:
      type: object
      description: |
        A monetary amount as an integer count of the currency's minor units.
        Floating point is never used for money. The number of minor units in
        one major unit is 10^scale, where scale comes from ISO 4217 — it is not
        always 2. JPY and KRW have no minor unit; BHD, KWD and TND have three.
      required: [currency, minorUnits]
      additionalProperties: false
      properties:
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        minorUnits:
          type: integer
          format: int64
          description: Signed count of minor units.
          examples: [125000]
      examples:
        - { currency: "SGD", minorUnits: 125000 }
        - { currency: "JPY", minorUnits: 125000 }

    Organisation:
      type: object
      description: |
        A tenant of the platform. All synthetic — no real legal entity is
        represented anywhere in CloFin.
      required: [id, legalName, shortName, status]
      properties:
        id: { type: string, format: uuid }
        legalName:
          type: string
          examples: ["Meridian Freight Holdings Pte Ltd"]
        shortName:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,63}$"
          description: Unique case-insensitively; appears in exports and filenames.
          examples: ["meridian"]
        status:
          type: string
          enum: [active, suspended, closed]

    CreateOrganisationRequest:
      type: object
      required: [legalName, shortName]
      additionalProperties: false
      properties:
        legalName: { type: string, minLength: 1 }
        shortName:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,63}$"

    Account:
      type: object
      description: |
        A ledger account. `type` determines `normalBalance`, which is what turns
        a pile of debits and credits into a balance with a sign a finance team
        would recognise.
      required: [id, organisationId, code, name, type, currency, status, normalBalance]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        code:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{1,63}$"
          description: Unique within an organisation.
          examples: ["1100-CLIENT-FUNDS"]
        name: { type: string, examples: ["Client funds — pooled"] }
        type:
          type: string
          enum: [asset, liability, equity, revenue, expense]
        currency:
          $ref: "#/components/schemas/CurrencyCode"
          description: Every line posted to this account must be in this currency.
        status:
          type: string
          enum: [active, frozen, closed]
          description: |
            Only `active` accepts postings. A closed account is retained
            forever, because the entries referencing it are retained forever.
        normalBalance:
          type: string
          enum: [debit, credit]
          description: |
            Derived from `type`. The side on which this account carries a
            positive balance.

    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [code, name, type, currency]
      properties:
        organisationId:
          type: string
          format: uuid
          description: |
            Optional. The organisation comes from the authenticated actor; when
            sent, it is verified against the actor's own and refused with `403`
            if it differs. It was `required` here while the handler never read
            it as a required field (finding **A-012**).
        code:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{1,63}$"
        name: { type: string, minLength: 1 }
        type:
          type: string
          enum: [asset, liability, equity, revenue, expense]
        currency:
          $ref: "#/components/schemas/CurrencyCode"

    AccountList:
      type: object
      required: [accounts, count, limit]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        count: { type: integer }
        limit:
          type: integer
          description: Maximum rows this operation returns.
          examples: [500]

    JournalLine:
      type: object
      description: |
        One side of a movement. Amounts are strictly positive — `direction`
        carries the sign, and a negative amount would be a second way to
        express the same thing.
      required: [accountId, direction, amount]
      additionalProperties: false
      properties:
        accountId: { type: string, format: uuid }
        direction:
          type: string
          enum: [debit, credit]
        amount:
          $ref: "#/components/schemas/Money"

    EntryReference:
      type: object
      description: |
        The business object that caused the entry. An entry with no reference is
        not permitted: every movement of money must be explainable by something
        that caused it.
      required: [type, id]
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - payment-instruction
            - settlement-item
            - reconciliation-adjustment
            - fee-assessment
            - fx-conversion
            - reversal
            - opening-balance
        id:
          type: string
          format: uuid
          description: |
            For `reversal`, the entry being reversed. That link is unique — an
            entry can be reversed at most once.

    JournalEntry:
      type: object
      required: [id, organisationId, occurredAt, narrative, reference, lines]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        occurredAt:
          type: string
          format: date-time
          description: When the economic event happened. Supplied by the caller.
        recordedAt:
          type: string
          format: date-time
          description: |
            When CloFin was told. Set by the service, and present when the entry
            has been read back from the journal.
        narrative: { type: string, examples: ["Opening balance"] }
        reference:
          $ref: "#/components/schemas/EntryReference"
        lines:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/JournalLine"

    PostJournalEntryRequest:
      type: object
      required: [occurredAt, narrative, reference, lines]
      additionalProperties: false
      properties:
        organisationId:
          type: string
          format: uuid
          description: |
            Optional. The organisation comes from the authenticated actor; when
            sent, it is verified against the actor's own and refused with `403`
            if it differs. It was `required` here while the handler never read
            it as a required field (finding **A-012**).
        occurredAt:
          type: string
          format: date-time
          description: Must carry a zone. A local time with no offset is rejected.
        narrative: { type: string, minLength: 1 }
        reference:
          $ref: "#/components/schemas/EntryReference"
        lines:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/JournalLine"

    Movement:
      type: object
      description: |
        One journal line as it appears on a statement, with the account's
        balance after it.
      required: [entryId, lineNo, occurredAt, narrative, direction, amount, runningBalance]
      properties:
        entryId: { type: string, format: uuid }
        lineNo:
          type: integer
          description: |
            Position within its entry. Present because an entry may touch the
            same account twice, and the two lines are otherwise identical.
        occurredAt: { type: string, format: date-time }
        narrative: { type: string }
        direction:
          type: string
          enum: [debit, credit]
        amount:
          $ref: "#/components/schemas/Money"
        runningBalance:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: |
            The account's balance after this movement, in the account's own
            terms — a positive liability balance means money is owed.

    Statement:
      type: object
      required: [account, from, to, openingBalance, closingBalance, movements, truncated, movementCap]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        from:
          type: string
          format: date-time
          description: Start of the period, inclusive.
        to:
          type: string
          format: date-time
          description: End of the period, exclusive.
        openingBalance:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Derived from every line strictly before `from`.
        closingBalance:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: |
            Derived from every line strictly before `to`. Aggregated over the
            whole journal, so it stays correct when `truncated` is true.
        movements:
          type: array
          description: |
            Ordered by occurrence, then by recording time, then by entry id and
            line number — a total order, so the same query over unchanged data
            produces the same document every time.
          items:
            $ref: "#/components/schemas/Movement"
        truncated:
          type: boolean
          description: |
            True when the period holds more than `movementCap` movements and
            the earliest `movementCap` were returned. The last `runningBalance`
            is then not a closing figure.
        movementCap:
          type: integer
          description: Maximum movements this operation returns.
          examples: [500]

    PaymentStatus:
      type: string
      description: |
        Where an instruction is in its lifecycle. The permitted moves between
        these are held as data in `clofin.payments.state/transitions` and are
        tested by enumerating every (state, event) pair — see
        `DOMAIN_MODEL.md` §3.

        `settled`, `rejected`, `cancelled`, `failed` and `returned` are
        terminal. A settled payment is never mutated; it is followed by a *new*
        reversal instruction.
      enum:
        - draft
        - pending-approval
        - approved
        - released
        - settled
        - rejected
        - cancelled
        - failed
        - returned

    PaymentEvent:
      type: string
      description: |
        A move an instruction may make. Eight of the nine have a driver in this
        contract today:

        - `submit` — `submitPaymentInstruction`
        - `cancel` — `cancelPaymentInstruction`
        - `approve` and `reject` — `approvePaymentInstruction`
        - `amend` — `amendPaymentInstruction`, which drives the in-place edit of
          a draft and this lifecycle move by reading the state rather than
          testing a status (ADR-0014 amendment 1)
        - `release` — `submitSettlementBatch`
        - `settle` and `return` — `recordSchemeResponse`

        **`fail` has no driver, deliberately.** Nothing marks an instruction
        failed: a settlement item whose outcome CloFin does not know is swept as
        timed out and the instruction stays `released`, because saying it failed
        would claim the payment did not happen — which nobody can support — and
        would free it to be batched again. See
        `clofin.settlement.service/sweep-timeouts!`.

        This paragraph said only `submit` and `cancel` had an operation, which
        stopped being true when approval and settlement were built (residual
        **C-R10a**); corrected 2026-09-06. `clofin.contract-test` now derives
        the driven set from the code, so it cannot go stale again silently.
      enum: [submit, cancel, approve, reject, amend, release, settle, fail, return]

    PurposeCode:
      type: string
      description: |
        Purpose of payment, from a constrained vocabulary. A synthetic subset
        of ISO 20022 `ExternalPurpose1Code`, chosen to cover the payment types
        CloFin models. It is **not** corridor-accurate: which codes a real
        scheme accepts, and which it mandates, differ by scheme and by
        jurisdiction, and CloFin is connected to neither.
      enum: [CASH, CHAR, DIVI, GDDS, INSU, INTC, LOAN, PENS, RENT, SALA, SCVE,
             SUPP, TAXS, TRAD, TREA]
      examples: ["SUPP"]

    PaymentInstruction:
      type: object
      description: |
        A request to move money. Mutable while `draft`; immutable in substance
        thereafter.

        Not a journal entry: this is the intent, and the entry is the
        accounting fact it eventually causes.
      required: [id, organisationId, debtorAccountId, creditorName,
                 creditorAccount, amount, valueDate, purposeCode, status,
                 createdBy, createdAt, permittedTransitions, screeningDigest]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        debtorAccountId:
          type: string
          format: uuid
          description: |
            The ledger account the value comes from. Must be `active` and hold
            the instruction's currency.
        creditorName:
          type: string
          maxLength: 140
          description: |
            Synthetic. No counterparty named in CloFin corresponds to anything
            real. Bounded at ISO 20022's `Max140Text` so an instruction CloFin
            accepts is one a scheme message could carry.
          examples: ["Pacific Rim Logistics Pte Ltd"]
        creditorAccount:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{2,32}[A-Z0-9]$"
          description: |
            A synthetic external account identifier. It addresses nothing; the
            character set is deliberately narrower than any real scheme's.
          examples: ["SG-SYNTH-88012345"]
        amount:
          $ref: "#/components/schemas/Money"
        valueDate:
          type: string
          format: date
          description: |
            The date settlement is requested for. A calendar date, not an
            instant — a value date is the same day in every zone that quotes
            it. Must not be in the past, judged in UTC.
          examples: ["2026-08-10"]
        purposeCode:
          $ref: "#/components/schemas/PurposeCode"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        createdBy:
          type: string
          format: uuid
          description: |
            The actor that raised this instruction, taken from the
            authenticated principal. A caller that sends it is refused rather
            than quietly overridden.

            This is the maker side of segregation of duties: the approval
            endpoint refuses this actor.
        createdAt: { type: string, format: date-time }
        reversesId:
          type: string
          format: uuid
          description: |
            Present only on a reversal, naming the settled instruction it was
            raised against. That instruction is unchanged.
        retriesId:
          type: string
          format: uuid
          description: |
            Present only on a **retry**, naming the `returned` instruction this
            one was raised to replace. That instruction is unchanged, and this
            one is submitted and approved entirely on its own merits — a return
            is new information a checker should see before the money goes out
            again.

            Set when the instruction is created and never afterwards. A `PATCH`
            naming it is `422`, and the database refuses a change to the column
            from any writer.
        clientReference:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[\x21-\x7E]+$'
          description: |
            Present only when the creating client sent one: the identifier it
            keeps for this payment, exactly as sent — printable ASCII, no spaces.
            At most one instruction per organisation carries a given reference.
            Set when the instruction is created and never afterwards (ADR-0028
            D6).
          examples: ["agent-ref-0001"]
        creditorCountry:
          type: string
          pattern: "^[A-Z]{2}$"
          description: |
            Present only when known: the beneficiary's country as an ISO 3166-1
            alpha-2 **shape** — two uppercase letters. Syntax only; no list of
            countries is consulted, because the field is synthetic and a
            membership check would make it look like a real-world validation.
          examples: ["SG"]
        retriedByIds:
          type: array
          description: |
            The instructions raised to replace **this** one, present only on a
            returned instruction that has been retried. The other end of
            `retriesId`, derived at read time from the retries themselves rather
            than stored, so the two ends cannot disagree.

            A list rather than a single id: the link carries no uniqueness rule,
            because every candidate rule would have to encode a second copy of
            the payment lifecycle in an index — an original whose first retry
            was cancelled may be retried again. The ordinary case has one
            member.
          items: { type: string, format: uuid }
        permittedTransitions:
          type: array
          description: |
            The events this instruction's current state allows, derived from
            the lifecycle table. A caller does not have to hold its own copy of
            the state machine to know what it may do next, and this list cannot
            advertise an operation the state machine would refuse. Empty on a
            terminal state.
          items:
            $ref: "#/components/schemas/PaymentEvent"
        screeningDigest:
          type: string
          readOnly: true
          pattern: '^[0-9a-f]{64}$'
          description: |
            The digest core's screening decisions about this instruction are
            bound to (C-07, ADR-0028 D5 Amendment 1): lowercase SHA-256 hex
            over the canonical form of a versioned projection —
            `screening-subject/1` — of its identity and screened content: id,
            organisation, debtor account, creditor name, account and country,
            amount, value date and purpose code. **Not** status, provenance or
            timestamps, so a submission does not change it and an amendment
            does. A screening client sends it back as `instructionDigest` rather
            than reimplementing the canonical form. Derived; never accepted.

    CreatePaymentInstructionRequest:
      type: object
      description: |
        **`createdBy` is not a member of this request and sending it is `422`.**
        It is derived from the authenticated actor — the `X-Actor-Id` header —
        and refused rather than ignored, because a caller that sent it would
        otherwise believe it had recorded who raised the payment. It was
        `required` here, and simultaneously refused by the handler, until the
        `ref-1` release audit (finding **A-012**): no conformant request could
        succeed, which made this schema unsatisfiable rather than merely stale.
      required: [debtorAccountId, creditorName, creditorAccount,
                 amount, valueDate, purposeCode]
      additionalProperties: false
      properties:
        organisationId:
          type: string
          format: uuid
          description: |
            Optional. The organisation comes from the authenticated actor; when
            sent, this is **verified against it and refused with `403` if it
            differs** rather than trusted or silently reinterpreted. It also
            appears in the `Location` header of the created instruction.
        debtorAccountId: { type: string, format: uuid }
        creditorName: { type: string, minLength: 1, maxLength: 140 }
        creditorAccount:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{2,32}[A-Z0-9]$"
        amount:
          $ref: "#/components/schemas/Money"
        valueDate:
          type: string
          format: date
          description: |
            `YYYY-MM-DD`. Must not be in the past, and must be within 365 days
            — a warehoused payment is a real product; one dated four centuries
            out is a typo that would otherwise sit in `pendingApproval` forever,
            indistinguishable from work in progress.
        purposeCode:
          $ref: "#/components/schemas/PurposeCode"
        reversesId:
          type: string
          format: uuid
          description: |
            Set to raise this instruction as a reversal of a **settled** one.
            The result is a new instruction; the original is not modified.
            Mutually exclusive with `retriesId`.
        retriesId:
          type: string
          format: uuid
          description: |
            Set to raise this instruction as a **retry** of a `returned` one.
            The result is a new instruction; the original is not modified.
            Retrying anything that is not `returned` is `409`, and naming an
            instruction in another organisation is `422` reported as
            non-existence rather than as forbidden.

            No rule constrains the amount, the currency, the beneficiary or the
            value date against the original. A return is new information — a
            closed account, a rejected beneficiary — and correcting one of those
            is the ordinary reason to retry, so a link that only accepted an
            identical payment would refuse exactly the retries that matter.

            Mutually exclusive with `reversesId`: a payment succeeds a settled
            one or replaces a returned one, never both, and sending both is
            `422` naming both members.
        clientReference:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[\x21-\x7E]+$'
          description: |
            Optional. The identifier the client keeps for this payment:
            printable ASCII, no spaces, 1–128 characters, stored exactly as sent
            — a trailing space is refused, not removed. Unique per organisation;
            see the operation for the three rules a repeated reference follows.
            It cannot be amended or added later.
        creditorCountry:
          type: string
          pattern: "^[A-Z]{2}$"
          description: |
            Optional. The beneficiary's country as an ISO 3166-1 alpha-2 shape:
            two uppercase letters, syntax only. `sg` is refused, not upper-cased.

    AmendPaymentInstructionRequest:
      type: object
      description: |
        A partial update of a draft. Only the members below may appear —
        anything else, including `status` and `createdBy`, is `422` rather than
        being ignored.
      additionalProperties: false
      properties:
        organisationId:
          type: string
          format: uuid
          description: |
            Optional, and **not itself amendable** — it scopes the request. The
            organisation comes from the authenticated actor; when sent, it is
            verified against the actor's own and refused with `403` if it
            differs. It was `required` here while the handler treated it as an
            optional scoping member (finding **A-012**).
        debtorAccountId: { type: string, format: uuid }
        creditorName: { type: string, minLength: 1, maxLength: 140 }
        creditorAccount:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{2,32}[A-Z0-9]$"
        amount:
          $ref: "#/components/schemas/Money"
        valueDate: { type: string, format: date }
        purposeCode:
          $ref: "#/components/schemas/PurposeCode"
        creditorCountry:
          type: string
          pattern: "^[A-Z]{2}$"
          description: |
            The beneficiary's country, two uppercase letters, syntax only.
            `clientReference` is deliberately absent: it is set at creation and
            a `PATCH` naming it is `422`.

    PaymentInstructionActionRequest:
      type: object
      description: |
        The body of a lifecycle operation. `organisationId` is optional and,
        when sent, is verified against the authenticated actor's organisation
        rather than trusted — the idempotency key is scoped to the actor's own
        organisation either way.
      additionalProperties: false
      properties:
        organisationId: { type: string, format: uuid }

    IdempotencyKeyLookup:
      type: object
      description: |
        What a creation's `Idempotency-Key` is bound to (ADR-0028 D6):
        `originalStatus` and `originalBody` are the response the creation
        stored, as a replay would serve it, and `currentStatus` is the
        instruction's status at the time of the read.
      required: [idempotencyKey, instructionId, boundAt, originalStatus,
                 originalBody, currentStatus]
      additionalProperties: false
      properties:
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            The key, as the service accepts it on the `Idempotency-Key` header:
            any non-blank string without control characters. Not constrained
            to a UUID — ADR-0028's fragment said `format: uuid`, which is
            narrower than what the service binds (corrected there, 2026-10-04).
        instructionId: { type: string, format: uuid }
        boundAt:
          type: string
          format: date-time
          description: When the key row was written — the creating transaction's time.
        originalStatus:
          type: integer
          description: The HTTP status the creation stored, `201`.
        originalBody:
          $ref: "#/components/schemas/PaymentInstruction"
          description: |
            The creation's response exactly as stored, byte for byte. A creation
            stored before `screeningDigest` existed (migration `0015`) carries
            none; one stored since carries the digest the instruction had when
            it was created, which an amendment has since moved.
        currentStatus:
          $ref: "#/components/schemas/PaymentStatus"

    ClientReferenceRefusalReason:
      type: string
      description: |
        Why a creation was refused for its `clientReference`, under
        `errors.reason` on the create operation's `409`. Each comes with
        `errors.instructionId`, the instruction the reference already names.

        - `client-reference-conflict` — the existing instruction's content, as
          it is now, differs from this request.
        - `client-reference-exists` — its content is identical, and it was
          created under a different `Idempotency-Key`.
      enum:
        - client-reference-conflict
        - client-reference-exists

    IdempotencyKeyLookupRefusalReason:
      type: string
      description: |
        Why the idempotency-key lookup did not answer with a binding, under
        `errors.reason`.

        - `no-binding` — `404`: no committed binding existed at the instant of
          the read. A creation still in flight may still commit.
        - `key-bound-to-another-operation` — `409`: the key is taken by an
          operation the lookup does not serve, named in `errors.operationId`
          (null for a row written before keys recorded their operation).
      enum:
        - no-binding
        - key-bound-to-another-operation

    PaymentInstructionList:
      type: object
      required: [paymentInstructions, count, limit, truncated]
      properties:
        paymentInstructions:
          type: array
          items:
            $ref: "#/components/schemas/PaymentInstruction"
        count: { type: integer }
        limit:
          type: integer
          description: Maximum rows this operation returns.
          examples: [500]
        truncated:
          type: boolean
          description: |
            True when there were more rows than `limit`. Stated on every
            response, not only when true: a consumer should not have to infer
            from the absence of a field that nothing was left out.

    Approval:
      type: object
      description: |
        One actor's decision on one **payment instruction or one reconciliation
        adjustment**. Exactly one of `instructionId` and `adjustmentId` is
        present, mirroring the database constraint that a decision is about one
        thing.

        There is one maker–checker control in CloFin and this is its record: one
        table, one no-delete guarantee, one invalidation semantic, one pure
        decision function. A second approvals mechanism for adjustments would
        have been a second copy of all four.

        A decision is never deleted — the database refuses it. An approval that
        stops standing, because the instruction was amended or because its
        actor withdrew it, keeps its row and gains an `invalidatedAt`.
      required: [id, actorId, decision, decidedAt, live]
      properties:
        id: { type: string, format: uuid }
        instructionId:
          type: string
          format: uuid
          description: |
            The payment instruction decided on. Absent when the decision is
            about a reconciliation adjustment.
        adjustmentId:
          type: string
          format: uuid
          description: |
            The reconciliation adjustment decided on. Absent when the decision
            is about a payment instruction.
        actorId:
          type: string
          format: uuid
          description: The actor who decided. Authenticated, not asserted.
        decision:
          type: string
          enum: [approved, rejected]
        reason:
          type: string
          description: |
            Mandatory on a rejection and retained, because a refused payment
            that nobody can explain afterwards is a gap in the record. Absent
            on an approval unless one was given.
          examples: ["Counterparty not verified for this corridor"]
        decidedAt: { type: string, format: date-time }
        live:
          type: boolean
          description: |
            False once the decision has been invalidated. Stated on every
            approval, not only when false: a consumer should not have to infer
            from an absent field that a decision still stands.
        invalidatedAt:
          type: string
          format: date-time
          description: |
            Present when the decision no longer stands — set by an amendment
            (which invalidates every approval) or by the approver withdrawing
            it.

    ApprovalDecisionRequest:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        organisationId:
          type: string
          format: uuid
          description: Optional, and verified against the actor's organisation.
        decision:
          type: string
          enum: [approved, rejected]
          description: |
            No default. A decision CloFin does not recognise is refused rather
            than defaulted, because the safe default would have to be one of
            these two and either choice is a decision nobody made.
        reason:
          type: string
          minLength: 1
          description: |
            Required when `decision` is `rejected`; a blank one is `422`. The
            database enforces it again, so a rejection with no reason is not
            representable rather than merely rejected by this layer.

    ApprovalOutcome:
      type: object
      required: [approval, paymentInstruction, approvalsHeld, satisfied]
      properties:
        approval:
          $ref: "#/components/schemas/Approval"
        paymentInstruction:
          $ref: "#/components/schemas/PaymentInstruction"
        approvalsRequired:
          type: integer
          description: |
            How many approvals this amount needs, from the organisation's band
            table for its currency.
          examples: [2]
        approvalsHeld:
          type: integer
          description: How many now stand, including the one just recorded.
          examples: [1]
        satisfied:
          type: boolean
          description: |
            True when this decision completed the requirement and the
            instruction moved. False leaves it `pendingApproval` — stated
            explicitly so an approver is never left guessing whether theirs was
            the last one needed.

    ApprovalQueueRow:
      type: object
      required: [paymentInstruction, priorApprovals, approvalsHeld, canApprove]
      properties:
        paymentInstruction:
          $ref: "#/components/schemas/PaymentInstruction"
        priorApprovals:
          type: array
          description: |
            The approvals that already stand, so the next approver can see who
            agreed before them rather than deciding blind.
          items:
            $ref: "#/components/schemas/Approval"
        approvalsHeld: { type: integer, examples: [1] }
        approvalsRequired:
          type: integer
          description: |
            Absent when the organisation has configured no band covering this
            amount — in which case it cannot be approved at all.
          examples: [2]
        approvalsRemaining: { type: integer, examples: [1] }
        canApprove:
          type: boolean
          description: |
            Whether *this* actor may approve *this* row, decided by the same
            function that would refuse the approval itself.
        refusalReason:
          $ref: "#/components/schemas/ApprovalRefusalReason"
        screening:
          type: object
          description: |
            Core's latest accepted screening decision over the instruction's
            current content. Optional only because an instruction submitted
            before screening was built carries none.
          required: [resultId, outcome, listVersion, recordedAt]
          additionalProperties: false
          properties:
            resultId: { type: string, format: uuid }
            outcome:
              type: string
              enum: [clear, hit]
            listVersion: { type: string, minLength: 1, maxLength: 128 }
            recordedAt: { type: string, format: date-time }

    ApprovalRefusalReason:
      type: string
      description: |
        Why an approval was or would be refused. A closed vocabulary, so a
        client can branch on the control rather than on prose that may be
        reworded.

        `selfApproval` is reported in preference to every other reason when
        more than one applies: it is the only one that can never be resolved,
        because a maker never becomes a valid checker for their own payment.
      enum:
        - self-approval
        - not-an-approver
        - above-actor-limit
        - already-approved
        - no-threshold-configured

    ApprovalQueue:
      type: object
      required: [approvalQueue, count, actor, truncated]
      properties:
        approvalQueue:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalQueueRow"
        count: { type: integer }
        actor:
          $ref: "#/components/schemas/Actor"
        truncated: { type: boolean }

    Actor:
      type: object
      description: |
        As much of an actor as any caller needs to see.

        Roles and limits are deliberately absent. A caller that can read
        another actor's limit knows exactly how large a payment to split an
        amount into, and an endpoint listing an organisation's approvers and
        their ceilings is a reconnaissance tool. The display name is here
        because a queue showing only UUIDs is unreadable to the person meant to
        act on it.
      required: [id, displayName, status]
      properties:
        id: { type: string, format: uuid }
        displayName:
          type: string
          description: Synthetic. No actor in CloFin corresponds to a real individual.
          examples: ["Wei (checker)"]
        status:
          type: string
          enum: [active, suspended]

    SettlementBatchItem:
      type: object
      description: |
        One instruction's membership of one batch, and what became of it.
      required: [instructionId]
      properties:
        instructionId: { type: string, format: uuid }
        outcome:
          type: string
          nullable: true
          enum: [settled, returned, timed-out]
          description: |
            Null while the simulated scheme has not answered. `timed-out` means
            **unknown** — CloFin stopped waiting — not failed, and a
            `timeout-resolution` is what says which of the two really happened.

            No outcome frees the instruction for another batch. A membership is
            permanent: a returned payment is terminal and is retried as a new
            instruction.

            There is deliberately no `failed`: a scheme failure that sends the
            money back is a `returned`.
        outcomeReason:
          type: string
          description: Required on a `returned` item; the simulated scheme's stated reason.
        resolvedAt: { type: string, format: date-time }

    SchemeResponseRefusalReason:
      type: string
      description: |
        Why CloFin refused a scheme response, as a stable machine code. The
        complete set a caller may receive under `errors.dispositionReason` on a
        `409`.

        - `item-already-resolved` — the item already has an outcome; a late
          answer for a timed-out item must arrive as a `timeout-resolution`.
        - `item-not-timed-out` — nothing for a timeout resolution to resolve.
        - `item-not-in-batch` — this batch has no membership for that
          instruction.
        - `replay-key-conflict` — this batch, instruction, kind and reference
          already name a *different* message. Alone among these, it is **never
          stored**: the refusal happens because a receipt for that identity
          already exists, and writing a second row would defeat the replay key
          that produced it. See `StoredSchemeResponseRefusalReason`.
      enum:
        - item-already-resolved
        - item-not-timed-out
        - item-not-in-batch
        - replay-key-conflict

    StoredSchemeResponseRefusalReason:
      type: string
      description: |
        The subset of `SchemeResponseRefusalReason` that can be recorded on a
        receipt. Present only when `disposition` is `refused`.

        Narrower than the set a caller may be told, by exactly one value, and
        the difference is a fact rather than an omission — `replay-key-conflict`
        refuses *because* a receipt already exists, so it has no receipt of its
        own to carry it.
      enum:
        - item-already-resolved
        - item-not-timed-out
        - item-not-in-batch

    SchemeResponseRecord:
      type: object
      description: |
        A simulated scheme response as recorded — a **receipt**. Kept whether or
        not it caused work, including when CloFin could not act on it at all:
        the evidence that a message arrived is the point of storing them, and a
        receipt destroyed by its own processing failure is not a receipt.
      required: [id, kind, reference, receivedAt, disposition]
      properties:
        id: { type: string, format: uuid }
        instructionId:
          type: string
          format: uuid
          description: Absent on a batch-level `ack`.
        kind:
          type: string
          enum: [ack, settled, returned, timeout-resolution]
        reference: { type: string }
        receivedAt: { type: string, format: date-time }
        disposition:
          type: string
          enum: [applied, acknowledged, refused]
          description: |
            What CloFin did about this arrival.

            - `applied` — it resolved an item, transitioned the instruction and
              posted finality.
            - `acknowledged` — a batch-level `ack`: recorded by design, moves
              nothing.
            - `refused` — it arrived, it is kept, and the item was not in a
              state this kind could resolve. The caller received `409` **after**
              this receipt committed, and replaying this exact message
              reproduces this same refusal rather than re-evaluating it against
              whatever state has arrived since.
        dispositionReason:
          $ref: "#/components/schemas/StoredSchemeResponseRefusalReason"
        outcome:
          type: string
          enum: [settled, returned]
          description: |
            What this response *claimed*, on the arrival that acted on it.
            Absent on an `ack` and on a refused arrival, which resolved nothing.
            Distinct from `SettlementBatchItem.outcome`, which is what CloFin
            **recorded** — the two differ in exactly the case that matters, a
            message kept as evidence that did no work.
        reason:
          type: string
          description: The reason this response carried, normalised.

    SettlementBatch:
      type: object
      description: |
        A set of approved payment instructions submitted to a **simulated**
        scheme as a unit, sharing one (scheme, currency, value date).
      required: [id, organisationId, scheme, currency, valueDate, status, createdBy, createdAt, simulated]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        scheme:
          type: string
          enum: [SIM-RTGS, SIM-ACH]
          description: |
            Simulated schemes only. The `SIM-` prefix is enforced by a database
            check constraint so a synthetic record can never name a real
            network.
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        valueDate: { type: string, format: date }
        status:
          type: string
          enum: [open, submitted, settled, partially-settled, failed]
          description: |
            **Derived from the items' outcomes, never set directly** — the same
            doctrine that makes a balance an aggregation over the journal rather
            than a stored column. `open` before submission; `submitted` while
            any item is unresolved; then `settled` (all settled), `failed` (none
            settled) or `partially-settled` (a mix).

            A batch of items that all timed out derives to `failed`. That is a
            statement about what CloFin knows, not about what the scheme did —
            the items carry the distinction, and a late `timeout-resolution` can
            move the batch off `failed`.
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/SettlementBatchItem"
        itemCount: { type: integer }
        exceptions:
          type: array
          description: |
            The returned items, with their reasons — the exception cases an
            operator has to act on, surfaced rather than left to be filtered out
            of `items` client-side.
          items:
            $ref: "#/components/schemas/SettlementBatchItem"
        schemeResponses:
          type: array
          items:
            $ref: "#/components/schemas/SchemeResponseRecord"
        replayed:
          type: boolean
          description: |
            On `recordSchemeResponse` only: true when this delivery was the
            **same message** as one already received — same
            `(instructionId, kind, reference)` *and* the same `outcome` and
            `reason` — so it did no work and this body reproduces the original
            answer.

            A delivery that reuses a reference while saying something different
            is never reported here. It is `409`, because a caller cannot be told
            CloFin has already seen a request nobody sent.
        disposition:
          type: string
          enum: [applied, acknowledged]
          description: |
            On `recordSchemeResponse` only: what CloFin did about this arrival.
            A `refused` disposition is reported as `409` rather than in a `200`
            body; the receipt carrying it is still readable under
            `schemeResponses`.
        outcome:
          type: string
          nullable: true
          description: |
            On `recordSchemeResponse` only: the outcome this response resolved
            the item to, `null` for an `ack`. **A replay carries the original
            response's outcome**, not `null` — the answer being replayed is
            reproduced, not merely acknowledged.
        timedOut:
          type: array
          description: "On `sweepSettlementTimeouts` only: the instructions this sweep gave up on."
          items: { type: string, format: uuid }
        timeoutSeconds:
          type: integer
          description: "On `sweepSettlementTimeouts` only: the horizon applied."
        simulated:
          type: boolean
          description: |
            Always true. CloFin settles against simulated schemes only, and says
            so in the payload rather than only in prose.

    SettlementBatchList:
      type: object
      required: [settlementBatches, count, limit, truncated, simulated]
      properties:
        settlementBatches:
          type: array
          items:
            $ref: "#/components/schemas/SettlementBatch"
        count: { type: integer }
        limit: { type: integer }
        truncated:
          type: boolean
          description: True when the row cap was reached and the answer is partial.
        simulated: { type: boolean }

    CreateSettlementBatchRequest:
      type: object
      required: [scheme, currency, valueDate, instructionIds]
      properties:
        organisationId:
          type: string
          format: uuid
          description: |
            Verified against the authenticated actor's organisation, never
            trusted. A mismatch is refused rather than ignored.
        scheme:
          type: string
          enum: [SIM-RTGS, SIM-ACH]
          description: |
            Which simulated scheme settles this batch. An operator's routing
            choice: a payment instruction carries no scheme attribute, so this
            is not derived from its members.
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        valueDate: { type: string, format: date }
        instructionIds:
          type: array
          minItems: 1
          description: |
            The approved instructions to batch. Every one must be `approved`, in
            this organisation, and carry the batch's currency and value date.
          items: { type: string, format: uuid }

    SchemeResponseRequest:
      type: object
      description: |
        A **simulated** scheme response. See `recordSchemeResponse` for how the
        simulation decides an outcome and how to produce partial failure on
        demand.
      required: [kind, reference]
      properties:
        organisationId: { type: string, format: uuid }
        kind:
          type: string
          enum: [ack, settled, returned, timeout-resolution]
        instructionId:
          type: string
          format: uuid
          description: Required for every kind except `ack`.
        reference:
          type: string
          description: |
            The scheme's own reference. Part of the replay key
            `(batch, instruction, kind, reference)`, so the same reference
            delivered twice is one response delivered twice and the second does
            no work.
        reason:
          type: string
          description: Required when `kind` is `returned`, or when a `timeout-resolution` resolves to `returned`.
        outcome:
          type: string
          enum: [settled, returned]
          description: |
            Required when `kind` is `timeout-resolution`: what the scheme now
            says really happened to an item CloFin had given up on.

    TimeoutSweepRequest:
      type: object
      properties:
        organisationId: { type: string, format: uuid }
        timeoutSeconds:
          type: integer
          minimum: 0
          description: |
            How old the batch must be before its unanswered items are given up
            on. Defaults to one hour. Measured from the batch's creation,
            because the schema records no submission time.

    StatementFormat:
      type: string
      description: |
        CloFin's own statement format. One value, and it is deliberately not any
        real one: not camt.053, not MT940, not BAI2, not any scheme's or bank's
        schema. A synthetic-data reference implementation parsing a real bank
        format would be fidelity theatre, and naming one would invite exactly
        the misreading this contract's scope statement exists to prevent.
      enum: [SIM-CLOFIN-RECON-STATEMENT]

    StatementLineType:
      type: string
      description: |
        What a statement line reports. Two, and deliberately only two: these are
        the outcomes a scheme *reaches*. A release is CloFin telling the scheme
        something, not the scheme telling CloFin, and a payment the scheme never
        answered about produces no line at all — its value sits in
        `1300-IN-TRANSIT` and its absence here is correct.
      enum: [settlement, return]

    MatchingRule:
      type: string
      description: |
        Which rule matched a line to a ledger movement. Applied in this order,
        first match wins, and recorded on every match — a match nobody can
        re-derive is a match nobody can defend to an auditor.

        * `R1-reference-amount-and-value-date` — reference, amount and value
          date all agree.
        * `R2-reference-and-amount` — reference and amount agree, value dates
          differ. The movement is identified and the date disagreement is a
          break.
        * `R3-reference-only` — the reference agrees and the amount does not.
          The two records are about the same payment and disagree about how much
          moved.
        * `R4-amount-and-value-date` — the line carries no end-to-end reference,
          and exactly one unmatched movement has its amount and value date.
          Last, because it identifies a movement by its attributes rather than
          by its name.

        A rule matches only when exactly one unmatched movement satisfies it.
        Two candidates is not a match: a guessed match is worse than a break,
        because a break is visible and a wrong match is not.

        The same list is published in `DOMAIN_MODEL.md` §6 and a guard compares
        the two with the code's sequence, in both directions and in order.
      enum:
        - R1-reference-amount-and-value-date
        - R2-reference-and-amount
        - R3-reference-only
        - R4-amount-and-value-date

    BreakKind:
      type: string
      description: |
        What disagreed. The check runs **both directions**: a statement line
        with no ledger counterpart is a break, and a ledger movement with no
        statement line is also one — and the second is the more interesting,
        because it is CloFin claiming a movement the scheme does not report.

        * `statement-line-unmatched` — the scheme reports money CloFin's ledger
          does not record on this account for this period.
        * `expectation-unmatched` — CloFin's ledger records a movement the
          statement does not report.
        * `duplicate-statement-line` — a second line claiming a payment
          reference another line has already matched.
        * `amount-mismatch` — matched on identity, and the two amounts differ.
        * `value-date-mismatch` — matched, and the two dates differ.
        * `line-type-mismatch` — matched, and the scheme calls the movement a
          settlement where the ledger's counter-account says return, or vice
          versa.
      enum:
        - statement-line-unmatched
        - expectation-unmatched
        - duplicate-statement-line
        - amount-mismatch
        - value-date-mismatch
        - line-type-mismatch

    BreakState:
      type: string
      description: |
        `open` → `investigating` → `resolved`. Held as data and enforced at the
        service boundary: a transition the table does not contain is `409`
        naming what would have been permitted, never applied silently. The
        terminal set is derived from the table rather than listed, so a state
        that gains an outgoing arrow stops being terminal in the same commit.

        Assigning an `open` break **is** the move to `investigating`.
        `resolved` is reached only by a posted adjustment.
      enum: [open, investigating, resolved]

    AdjustmentStatus:
      type: string
      description: |
        `proposed` until it is decided; `posted` once its entry is in the
        journal, which happens in the same transaction as the approval that
        completed the requirement; `rejected` once an approver has refused it,
        with a reason.

        Both endings are terminal, and they are not interchangeable: a posted
        adjustment moved the books and resolved its break, and a rejected one
        moved nothing and left the break exactly where it was — so a different
        adjustment may be raised against the same break. The lifecycle is
        `clofin.recon.adjustment/transitions` and is drawn from it at
        `docs/diagrams/reconciliation-adjustment-lifecycle.md`;
        `permittedTransitions` on every adjustment is read from the same table.
      enum: [proposed, posted, rejected]

    StatementRefusalReason:
      type: string
      description: |
        Why an arriving statement was refused, as a stable code. **Every code a
        caller may receive is here**, including the one that is never stored.
      enum: [no-reconciled-account, too-many-ledger-movements, replay-key-conflict]

    StoredStatementRefusalReason:
      type: string
      description: |
        The narrower set that can reach a stored receipt's `dispositionReason`.

        `replay-key-conflict` is outside it, and the asymmetry is a fact rather
        than an omission: that refusal happens **because** a receipt for the
        identity already exists, and writing a second row would defeat the
        replay key that produced the refusal. The first receipt is the evidence;
        the conflict is an answer to the caller and nothing else.
      enum: [no-reconciled-account, too-many-ledger-movements]

    PerturbationClass:
      type: string
      description: |
        How to make a generated statement wrong. A generator that could only
        produce agreement could not test disagreement; a *named* class lets a
        reviewer predict the break before running anything. Each is applied
        deterministically to the first line in the statement's canonical order,
        or appends one.

        * `none` — the statement the simulation would really send.
        * `missing-line` — drops a line, so the ledger records a movement the
          statement does not report.
        * `amount-mismatch` — increases a line's amount.
        * `unknown-line` — appends a line carrying a payment reference CloFin
          has never issued.
        * `duplicate-line` — repeats a line under a second line reference.
        * `shifted-value-date` — moves a line's value date later.
        * `flipped-line-type` — reports a settlement as a return, or a return as
          a settlement.
        * `reference-stripped` — removes a line's end-to-end reference. It still
          matches, by the weakest rule, and the match records that.
      enum:
        - none
        - missing-line
        - amount-mismatch
        - unknown-line
        - duplicate-line
        - shifted-value-date
        - flipped-line-type
        - reference-stripped

    StatementLine:
      type: object
      description: One movement the simulated scheme reports.
      required: [lineNo, schemeReference, lineType, amount, valueDate]
      properties:
        lineNo:
          type: integer
          description: |
            Position in the document, from 1, assigned by CloFin on arrival
            rather than read from it: a line's position is how a break addresses
            it, and two lines claiming one number would be two breaks claiming
            one identity.
        schemeReference:
          type: string
          description: The scheme's own reference for this line.
        paymentReference:
          type: string
          description: |
            The end-to-end reference the scheme echoed back — CloFin's payment
            instruction id. Absent when the scheme did not tag the line, which
            is a real case rather than missing data: such a line is matched on
            its attributes instead.
        lineType:
          $ref: "#/components/schemas/StatementLineType"
        amount:
          $ref: "#/components/schemas/Money"
        valueDate:
          type: string
          format: date
          description: |
            The day the scheme dates this movement to. CloFin dates the same
            movement by the day of its journal entry; the two agreeing is what
            a reconciliation is checking.

    SimulatedStatement:
      type: object
      description: |
        A statement as the simulated scheme would send it, in CloFin's own
        format. Postable straight back to `POST /reconciliation-statements`.
      required: [format, formatVersion, simulated, scheme, currency,
                 statementReference, periodStart, periodEnd, lines]
      properties:
        format:
          $ref: "#/components/schemas/StatementFormat"
        formatVersion:
          type: integer
          examples: [1]
        simulated:
          type: boolean
          description: |
            Always true, and stated in the document rather than only in this
            contract: a statement saved to a file and read a year later must
            still say what it is.
          enum: [true]
        scheme:
          type: string
          enum: [SIM-RTGS, SIM-ACH]
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        statementReference:
          type: string
          description: |
            The delivery's identity. Derived from what the statement is a
            statement *of*, so asking for the same statement twice produces the
            same reference and the second ingestion is a replay.
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        perturbation:
          $ref: "#/components/schemas/PerturbationClass"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/StatementLine"

    IngestStatementRequest:
      type: object
      description: |
        A statement document, plus the organisation the caller believes it is
        acting for. The document is exactly what
        `GET /settlement-statements` returns.
      required: [format, formatVersion, scheme, currency, statementReference,
                 periodStart, periodEnd, lines]
      properties:
        organisationId:
          type: string
          format: uuid
          description: |
            Optional, and **verified** against the authenticated actor's
            organisation rather than trusted.
        format:
          $ref: "#/components/schemas/StatementFormat"
        formatVersion: { type: integer, examples: [1] }
        scheme:
          type: string
          enum: [SIM-RTGS, SIM-ACH]
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        statementReference: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        simulated: { type: boolean }
        perturbation:
          $ref: "#/components/schemas/PerturbationClass"
        lines:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/StatementLine"

    ReconciliationMatch:
      type: object
      description: One statement line bound to one ledger movement.
      required: [lineNo, entryId, rule, matchedAt]
      properties:
        lineNo: { type: integer }
        entryId:
          type: string
          format: uuid
          description: The journal entry the line was matched to.
        rule:
          $ref: "#/components/schemas/MatchingRule"
        matchedAt: { type: string, format: date-time }

    ReconciliationBreak:
      type: object
      description: |
        A tracked, owned, ageing disagreement — not a discrepancy somebody will
        look at later.
      required: [id, statementId, accountId, kind, state, detail, assigneeId,
                 openedAt, ageSeconds, permittedTransitions]
      properties:
        id: { type: string, format: uuid }
        statementId: { type: string, format: uuid }
        accountId:
          type: string
          format: uuid
          description: The account being reconciled — in practice `1300-IN-TRANSIT`.
        kind:
          $ref: "#/components/schemas/BreakKind"
        state:
          $ref: "#/components/schemas/BreakState"
        lineNo:
          type: integer
          description: The statement line, when the break has one.
        entryId:
          type: string
          format: uuid
          description: The ledger movement, when the break has one.
        statementAmount:
          $ref: "#/components/schemas/Money"
        ledgerAmount:
          $ref: "#/components/schemas/Money"
        detail:
          type: string
          description: What disagreed, in words an operator can act on.
        assigneeId:
          type: string
          format: uuid
          description: |
            A break is never unowned. It opens assigned to the actor whose
            ingestion discovered it.
        openedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        ageSeconds:
          type: integer
          format: int64
          description: |
            **Derived at read time and stored nowhere.** A stored age is wrong
            the moment it is written, for the same reason a stored balance is.
        instructionId:
          type: string
          format: uuid
          description: |
            The payment instruction this break is about, **derived at read time**
            from whichever side of the disagreement the break has: the ledger
            entry's reference, or the statement line's end-to-end reference. Absent
            when neither side names one — an untagged line the matcher could not
            bind, for instance.
        retriedByInstructionIds:
          type: array
          description: |
            The instructions raised to replace `instructionId`, when it is a
            returned payment that has been retried. Derived the same way and
            present only when there is something in it.

            This is the exception workflow the retry link exists for: an
            investigator holding a break about a payment that came back asks
            first whether it was raised again, and before this the answer was
            reachable only by matching counterparty and amount by eye.
          items: { type: string, format: uuid }
        permittedTransitions:
          type: array
          description: |
            What the lifecycle allows from this state, read from the transition
            table — so this API cannot advertise an operation the state machine
            would refuse.
          items:
            type: string
            enum: [assign, resolve]

    ReconciliationBreakDetail:
      allOf:
        - $ref: "#/components/schemas/ReconciliationBreak"
        - type: object
          required: [adjustments, adjustmentsLimit, adjustmentsTruncated]
          properties:
            adjustments:
              type: array
              description: |
                Every adjustment raised against this break, oldest first,
                **bounded by `adjustmentsLimit`**. Read `adjustmentsTruncated`
                before treating the list as the whole set.
              items:
                $ref: "#/components/schemas/ReconciliationAdjustment"
            adjustmentsLimit:
              type: integer
              examples: [500]
              description: The largest number of adjustments this response can carry.
            adjustmentsTruncated:
              type: boolean
              description: |
                Stated on every response, not only when true: a consumer should
                not have to infer from the absence of a field that nothing was
                left out.

    ReconciliationBreakList:
      type: object
      required: [reconciliationBreaks, count, limit, truncated, kinds, states]
      properties:
        reconciliationBreaks:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationBreak"
        count: { type: integer }
        limit: { type: integer, examples: [500] }
        truncated:
          type: boolean
          description: |
            Stated on every response, not only when true: a consumer should not
            have to infer from the absence of a field that nothing was left out.
        kinds:
          type: array
          description: Every break kind this build can open, so a client can render a filter.
          items:
            $ref: "#/components/schemas/BreakKind"
        states:
          type: array
          items:
            $ref: "#/components/schemas/BreakState"

    ReconciliationStatement:
      type: object
      description: |
        A statement as received, with what CloFin did about it, its lines, its
        matches and the breaks it opened.
      required: [id, organisationId, scheme, currency, statementReference,
                 format, formatVersion, periodStart, periodEnd, disposition,
                 receivedAt, receivedBy, simulated, lines, matches, breaks,
                 breaksLimit, breaksTruncated]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        scheme:
          type: string
          enum: [SIM-RTGS, SIM-ACH]
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        statementReference: { type: string }
        format:
          $ref: "#/components/schemas/StatementFormat"
        formatVersion: { type: integer }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        disposition:
          type: string
          description: |
            What CloFin did about the arrival. `refused` rows exist and are
            kept: a receipt destroyed by its own processing failure is not a
            receipt.
          enum: [applied, refused]
        dispositionReason:
          $ref: "#/components/schemas/StoredStatementRefusalReason"
        reconciledAccountId:
          type: string
          format: uuid
          description: |
            The account this statement was compared against. Absent exactly when
            the statement was refused for want of one.
        receivedAt: { type: string, format: date-time }
        receivedBy: { type: string, format: uuid }
        simulated:
          type: boolean
          enum: [true]
        replayed:
          type: boolean
          description: |
            True when this exact document had already been delivered. Nothing
            was re-run and this is the original answer.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/StatementLine"
        matches:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationMatch"
        breaks:
          type: array
          description: |
            The breaks this statement opened, oldest first, **bounded by
            `breaksLimit`**. Read `breaksTruncated` before treating the list as
            the whole set; `GET /reconciliation-status` counts over the rows
            rather than over this list.
          items:
            $ref: "#/components/schemas/ReconciliationBreak"
        breaksLimit:
          type: integer
          examples: [500]
          description: The largest number of breaks this response can carry.
        breaksTruncated:
          type: boolean
          description: |
            Stated on every response, not only when true: a consumer should not
            have to infer from the absence of a field that nothing was left out.

    AssignBreakRequest:
      type: object
      required: [assigneeId]
      properties:
        organisationId: { type: string, format: uuid }
        assigneeId:
          type: string
          format: uuid
          description: An actor in this organisation. A break is never unowned.

    ProposeAdjustmentRequest:
      type: object
      required: [amount, direction, narrative]
      properties:
        organisationId: { type: string, format: uuid }
        amount:
          $ref: "#/components/schemas/Money"
        direction:
          type: string
          description: |
            The direction applied to the **reconciled** account. The suspense leg
            (`2200-UNAPPLIED`) is always the opposite, so the entry balances by
            construction.
          enum: [debit, credit]
        narrative:
          type: string
          maxLength: 500
          description: |
            Why the books are moving. Required: an entry between a clearing
            account and a suspense account with no explanation is the entry an
            investigation will be least able to read.

    ApproveAdjustmentRequest:
      type: object
      properties:
        organisationId: { type: string, format: uuid }
        decision:
          type: string
          description: |
            What this actor decided. Absent means `approved`, which is what this
            endpoint did before a refusal could be recorded at all — a default
            that changed the meaning of an existing caller's request would be a
            contract break dressed as a feature.

            The same member, the same vocabulary and the same default as
            `POST /payment-instructions/{id}/approvals`: there is one
            maker–checker control in CloFin, and an approver deciding about an
            adjustment sends what they would send about a payment.
          enum: [approved, rejected]
          default: approved
        reason:
          type: string
          description: |
            A note retained with the decision. Optional on an approval and
            **required** on a rejection: a refusal whose reason is retained is
            the difference between a trail that explains a declined correction
            and one that merely records that somebody declined it. Enforced in
            the domain and again by `approval_rejection_needs_reason` at the
            database, for both kinds of subject.

    ReconciliationAdjustment:
      type: object
      required: [id, breakId, amount, direction, narrative, status,
                 approvalsRequired, createdBy, createdAt, permittedTransitions]
      properties:
        id: { type: string, format: uuid }
        breakId: { type: string, format: uuid }
        amount:
          $ref: "#/components/schemas/Money"
        direction:
          type: string
          enum: [debit, credit]
        narrative: { type: string }
        status:
          $ref: "#/components/schemas/AdjustmentStatus"
        approvalsRequired:
          type: integer
          description: |
            Computed from the organisation's bands **at proposal** and stored,
            so lowering a band later cannot post an adjustment that never
            cleared the bar it was raised under. Zero means the proposer alone
            could post it.
        entryId:
          type: string
          format: uuid
          description: The journal entry it posted. Present exactly when `status` is `posted`.
        postedAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        permittedTransitions:
          type: array
          description: |
            The lifecycle events this adjustment's status still allows, read
            from `clofin.recon.adjustment/transitions`. A `proposed` adjustment
            allows both; a `posted` or `rejected` one allows nothing. Published
            so a caller need not hold a second copy of the lifecycle to know
            what it may still do.
          items:
            type: string
            enum: [post, reject]
        posted:
          type: boolean
          description: |
            Present on the proposal response: whether this call also moved the
            books, which happens exactly when the adjustment needed no
            approvals.
        break:
          $ref: "#/components/schemas/ReconciliationBreak"

    AdjustmentApprovalOutcome:
      type: object
      required: [approval, adjustment, break, posted, rejected, approvalsHeld,
                 approvalsRequired]
      properties:
        approval:
          $ref: "#/components/schemas/Approval"
        adjustment:
          $ref: "#/components/schemas/ReconciliationAdjustment"
        break:
          $ref: "#/components/schemas/ReconciliationBreak"
        posted:
          type: boolean
          description: True when this approval completed the requirement and the entry posted.
        rejected:
          type: boolean
          description: |
            True when this decision refused the adjustment. Mutually exclusive
            with `posted`: one refusal ends an adjustment, so a rejection never
            also posts. The `break` in the same document is unchanged — a
            rejection returns it to nobody, because proposing an adjustment
            never moved it — and a different adjustment may now be raised
            against it.
        approvalsHeld: { type: integer }
        approvalsRequired: { type: integer }

    ReconciliationStatus:
      type: object
      description: |
        Matched, unmatched and breaks by state, for one account over one period.
      required: [accountId, from, to, statements, lines, matchesByRule,
                 breaksByState, breaksByKind]
      properties:
        accountId: { type: string, format: uuid }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        statements:
          type: object
          required: [received, applied, refused]
          properties:
            received: { type: integer }
            applied: { type: integer }
            refused: { type: integer }
        lines:
          type: object
          required: [total, matched, unmatched]
          properties:
            total: { type: integer }
            matched: { type: integer }
            unmatched: { type: integer }
        matchesByRule:
          type: object
          description: |
            One entry per rule, including the rules that matched nothing — a
            consumer reads "no matches under this rule" rather than having to
            distinguish that from "this build does not know this rule".
          additionalProperties: { type: integer }
        breaksByState:
          type: object
          additionalProperties: { type: integer }
        breaksByKind:
          type: object
          additionalProperties: { type: integer }
        oldestUnresolvedAgeSeconds:
          type: [integer, "null"]
          format: int64
          description: |
            Derived at read time. Null when nothing is outstanding, which is a
            different statement from zero.

    ScreeningRule:
      type: object
      description: |
        One rule of a screening entry. `exact` is string equality with no case
        folding, trimming or normalisation; a field the instruction does not
        carry matches no rule on it. The three fields are the instruction's
        beneficiary fields — an `originator-*` rule has no per-instruction value
        in core, and a list naming one is refused when it is loaded.
      required: [field, operator, value]
      additionalProperties: false
      properties:
        field:
          type: string
          enum: [creditor-name, creditor-account, creditor-country]
        operator:
          type: string
          enum: [exact]
        value: { type: string, minLength: 1 }

    ScreeningEntry:
      type: object
      description: |
        One entry of a synthetic screening list. It matches an instruction when
        **every** one of its rules matches; a list is a `hit` when any entry
        matches.
      required: [id, rules]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        rules:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScreeningRule"

    ScreeningListSummary:
      type: object
      description: |
        One loaded version of the synthetic screening list, without its
        entries. `accepted` is true for the one version in force — never more
        than one; `retiredAt` is present once a version has been retired.
      required: [version, source, loadedAt, entryCount, accepted]
      additionalProperties: false
      properties:
        version: { type: string, minLength: 1, maxLength: 128, examples: ["synthetic-2026-10-v1"] }
        source:
          type: string
          description: Where the loading tool read the list from, recorded as provenance.
        loadedAt: { type: string, format: date-time }
        retiredAt: { type: string, format: date-time }
        entryCount: { type: integer, minimum: 0 }
        accepted: { type: boolean }

    ScreeningList:
      type: object
      description: |
        One version of the **synthetic** screening list with every entry and
        rule, as loaded. Read-only: loaded by the operator's tool, never by a
        client (ADR-0028 D5). CloFin-defined synthetic data — not derived from
        any real list — with exact matching; nothing here claims screening
        quality.
      required: [version, entries, loadedAt, source, entryCount, accepted]
      additionalProperties: false
      properties:
        version: { type: string, minLength: 1, maxLength: 128 }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ScreeningEntry"
        loadedAt: { type: string, format: date-time }
        source: { type: string }
        retiredAt: { type: string, format: date-time }
        entryCount: { type: integer, minimum: 0 }
        accepted: { type: boolean }

    ScreeningResultRequest:
      type: object
      description: |
        A client's screening result, sent as evidence (ADR-0028 D5). Core
        compares each matched entry's rules with the list's and refuses a claim
        on rules the list does not have; then recomputes, and stores both.
      required: [organisationId, listVersion, outcome, matchedEntries, instructionDigest]
      additionalProperties: false
      properties:
        organisationId:
          type: string
          format: uuid
          description: Verified against the authenticated actor's organisation, never trusted.
        listVersion: { type: string, minLength: 1, maxLength: 128 }
        outcome:
          type: string
          enum: [clear, hit]
        matchedEntries:
          type: array
          description: The entries the client matched, with their rules. Empty if and only if the outcome is `clear`.
          items:
            $ref: "#/components/schemas/ScreeningEntry"
        instructionDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            The instruction's `screeningDigest`, read from the instruction —
            core's digest of its identity and screened content.
        screenedAt:
          type: string
          format: date-time
          description: When the client says it screened, recorded as it said it.

    ScreeningResult:
      type: object
      description: |
        A screening result: core's own decision (`origin: core`), taken at
        every submission, or a client's result recorded as evidence beside
        core's recomputation (`origin: client`). **Only core's results gate
        submission.** A client's result — accepted or refused — transitions
        nothing; its `201` means evidence recorded, status unchanged.
      required: [id, organisationId, instructionId, listVersion, origin, outcome, matchedEntries,
                 coreOutcome, coreMatchedEntries, agrees, instructionDigest, disposition,
                 recordedBy, recordedAt, auditEventId]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        instructionId: { type: string, format: uuid }
        listVersion: { type: string, minLength: 1, maxLength: 128 }
        origin:
          type: string
          enum: [core, client]
        outcome:
          type: string
          enum: [clear, hit]
          description: What the result says — the client's claim, or core's own outcome on a core result.
        matchedEntries:
          type: array
          description: Entry ids, sorted. The client's claim; core's own on a core result.
          items: { type: string }
        coreOutcome:
          type: string
          enum: [clear, hit]
          description: Core's recomputation against `listVersion`.
        coreMatchedEntries:
          type: array
          description: Entry ids core matched, sorted.
          items: { type: string }
        agrees:
          type: boolean
          description: The outcome and the entry-id set both equal core's.
        instructionDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        disposition:
          type: string
          enum: [accepted, refused]
          description: |
            `accepted`: core reproduced the result (always, on a core result).
            `refused`: it did not, and the result is kept as evidence of that.
        dispositionReason:
          type: string
          enum: [screening-result-mismatch]
          description: Present exactly when `disposition` is `refused`.
        caseId:
          type: string
          format: uuid
          description: |
            Present when a case was opened by this hit — or, on the `201` that
            recorded it, when one was already open on the same content against
            the same list.
        screenedAt: { type: string, format: date-time }
        recordedBy:
          type: string
          format: uuid
          description: The actor whose request recorded the row — the client, or the maker whose submission core screened.
        recordedAt: { type: string, format: date-time }
        auditEventId:
          type: string
          format: uuid
          description: |
            The `screening-result.recorded` event. **Not a transition
            acknowledgment**: it records evidence, and no payment state changed
            with it.

    ScreeningResultList:
      type: object
      required: [screeningResults, count, limit, truncated]
      additionalProperties: false
      properties:
        screeningResults:
          type: array
          items:
            $ref: "#/components/schemas/ScreeningResult"
        count: { type: integer }
        limit: { type: integer, examples: [500] }
        truncated: { type: boolean }

    ScreeningCase:
      type: object
      description: |
        A hit awaiting, or carrying, a compliance disposition — bound to the
        instruction, the digest and the list version of the result that opened
        it. At most one case is open on an instruction at a time.
      required: [id, organisationId, instructionId, resultId, instructionDigest, listVersion,
                 status, openedAt, permittedTransitions]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        instructionId: { type: string, format: uuid }
        resultId: { type: string, format: uuid }
        instructionDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        listVersion: { type: string, minLength: 1, maxLength: 128 }
        status:
          type: string
          enum: [open, dispositioned]
        disposition:
          type: string
          enum: [false-positive, confirmed-hit]
        rationale: { type: string, minLength: 1, maxLength: 1000 }
        dispositionedBy: { type: string, format: uuid }
        dispositionedAt: { type: string, format: date-time }
        openedAt: { type: string, format: date-time }
        permittedTransitions:
          type: array
          description: What may be done to the case now — `disposition` while open, nothing after.
          items:
            type: string
            enum: [disposition]

    ScreeningCaseList:
      type: object
      required: [screeningCases, count, limit, truncated]
      additionalProperties: false
      properties:
        screeningCases:
          type: array
          items:
            $ref: "#/components/schemas/ScreeningCase"
        count: { type: integer }
        limit: { type: integer, examples: [500] }
        truncated: { type: boolean }

    ScreeningDispositionRequest:
      type: object
      required: [disposition, rationale]
      additionalProperties: false
      properties:
        organisationId: { type: string, format: uuid }
        disposition:
          type: string
          enum: [false-positive, confirmed-hit]
        rationale:
          type: string
          minLength: 1
          maxLength: 1000
          description: Why, in the deciding actor's words. Not blank.

    ScreeningRefusalReason:
      type: string
      description: |
        Every `errors.reason` a screening refusal carries, on whichever
        operation answers it:

        - `list-version-not-accepted` — `422`, recording: the version is unknown or retired.
        - `outcome-entries-inconsistent` — `422`, recording: a `hit` with no entries, a `clear` with some.
        - `matched-entries-unknown` — `422`, recording: an entry the version does not hold, or holds with other rules.
        - `instruction-digest-mismatch` — `422`, recording: not the instruction's current `screeningDigest`.
        - `screening-result-mismatch` — `422`, recording: core's recomputation disagrees; **the result is stored**, refused.
        - `screening-hit` — `409`, submit: core's decision is a hit that has not been dispositioned false-positive; core's result and the case are stored.
        - `screening-required` — `409`, submit: core holds no decision over the instruction's current content, or holds one against a retired list. The repository's own gate answers it, whoever calls it.
        - `no-screening-list-accepted` — `422`, submit: no list is accepted, so nothing can be screened and nothing is submitted.
        - `self-disposition` — `403`, disposition: the actor created the instruction.
      enum:
        - list-version-not-accepted
        - outcome-entries-inconsistent
        - matched-entries-unknown
        - instruction-digest-mismatch
        - screening-result-mismatch
        - screening-hit
        - screening-required
        - no-screening-list-accepted
        - self-disposition

    AuditAction:
      type: string
      description: |
        A constrained vocabulary rather than free text. An audit trail that has
        to be searched with `like '%approv%'` is an audit trail nobody can
        produce a complete answer from.

        An action named `<subject>.<transition>` is emitted only in the
        transaction where that transition commits. `approval.recorded` is
        therefore one event per decision, and `payment.approved` is one event
        for the payment — a payment on a two-approval band produces two of the
        first and one of the second. Counting `payment.approved` counts
        approved payments; counting `approval.recorded` counts decisions.

        Events whose action starts with `approval.` carry the **approval** as
        their `subjectId`, not the payment. `GET /audit/evidence/{subjectId}`
        for a payment includes them anyway, related through the approval's
        instruction.

        The action's prefix is its `subjectType`, with one exception:
        `payment.*` addresses the instruction record, whose subject type is
        spelt `payment-instruction`.

        `journal-entry.posted` is `posted` rather than `created` because a
        journal entry is never drafted and never amended — posting is the only
        transition it has, and a correction is a separate reversing entry with
        its own event.

        **A statement arriving is one event whether or not CloFin could process
        it.** `reconciliation-statement.received` is written for a refused
        arrival too — receipt and disposition are separate facts, and the
        disposition travels in the subject digest rather than in a second term.
        A *replayed* delivery creates no row and emits nothing: the trail
        records arrivals, not requests.

        **`reconciliation-break.assigned` is the transition.** A break becomes
        `investigating` by somebody taking it on, so ownership and state move
        together and leave one event. Re-assigning an already-investigating
        break emits the same term with a state that did not move, and the before
        and after digests differ in the assignee alone.

        **`settlement-batch.completed` and `settlement-batch.status-restated`
        are two different facts.** `completed` marks the transition *into* a
        complete batch, when its last unresolved item resolves. A late
        `timeout-resolution` can then move that already-terminal derived status
        again — `failed` to `settled`, say — and *that* is `status-restated`:
        later information correcting a figure that had already been reported.
        Emitted only where the derived status actually moves, so a late
        resolution that changes nothing at the batch level leaves no event
        claiming it did.

        **`reconciliation-adjustment.rejected` is the other ending.** An
        approver who refuses a proposed correction ends it, with a reason, and
        that is a different fact from its posting. The decision itself is
        `approval.recorded`, as it is for every other decision in CloFin: one
        refusal leaves two events, because a decision being taken and a subject
        becoming terminal are two things.

        **`screening-result.recorded` is one event per result stored, whatever
        it says** — core's decision at a submission, a client's result core
        reproduced, and a client's result core refused, which is stored rather
        than rolled back because the disagreement is the evidence. It is **not**
        a payment transition: recording a client's result writes no `payment.*`
        event, and neither does a submission screening refused.
        `screening-case.opened` is emitted where a case first exists, and
        `screening-case.dispositioned` where it reaches its one terminal status.

        **`payment.failed` is reserved and has no producer.** The payment
        lifecycle carries a `fail` arrow out of `released`, and nothing in
        CloFin drives it: a settlement item's outcome is `settled`, `returned`
        or `timed-out`, a scheme failure that sends the money back **is** a
        return, and an outcome nobody knows is a timeout — which leaves the
        payment `released`, because CloFin cannot claim a payment did not
        happen. The term is published rather than omitted so that a future
        increment can drive it without churning this enum. It is called out here
        because a consumer reading only this contract would otherwise be unable
        to distinguish "no payments have failed" from "this action has no
        producer" — and those are very different answers to give an auditor.
      enum:
        - payment.created
        - payment.submitted
        - payment.amended
        - payment.cancelled
        - payment.approved
        - payment.rejected
        - approval.recorded
        - approval.invalidated
        - approval.withdrawn
        - organisation.created
        - account.created
        - journal-entry.posted
        - payment.released
        - payment.settled
        - payment.returned
        - payment.failed
        - settlement-batch.created
        - settlement-batch.submitted
        - settlement-batch.completed
        - settlement-batch.status-restated
        - settlement-batch.timeout-swept
        - reconciliation-statement.received
        - reconciliation-break.opened
        - reconciliation-break.assigned
        - reconciliation-break.resolved
        - reconciliation-adjustment.proposed
        - reconciliation-adjustment.posted
        - reconciliation-adjustment.rejected
        - screening-result.recorded
        - screening-case.opened
        - screening-case.dispositioned

    AuditEvent:
      type: object
      description: |
        One state change: who, what, to which subject, when, and — as digests —
        what it changed from and to.

        Written in the same transaction as the change it describes, so a
        rolled-back change leaves no event and a committed one leaves exactly
        one.
      required: [id, organisationId, action, subjectType, subjectId, occurredAt]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        actorId:
          type: string
          format: uuid
          description: |
            Absent only where there is genuinely no authenticated actor, which
            is `organisation.created` and nothing else — `POST /organisations`
            is the bootstrap, and no actor can exist before the organisation
            that holds one.

            That is enforced, not conventional: an audit event for any other
            action is refused unless it names its actor, so an absent `actorId`
            can be read as the bootstrap rather than as a missing attribution.
            No placeholder actor is invented to fill it. See ADR-0017.
        action:
          $ref: "#/components/schemas/AuditAction"
        subjectType:
          type: string
          enum: [payment-instruction, approval, organisation, account, journal-entry,
                 settlement-batch, reconciliation-statement, reconciliation-break,
                 reconciliation-adjustment, screening-result, screening-case]
        subjectId: { type: string, format: uuid }
        beforeDigest:
          type: string
          description: |
            Digest of the subject before the change; absent when it did not
            exist, which is what distinguishes a creation from an update.

            **Not the value.** A digest proves that something changed, and what
            it changed to when compared against a value the auditor already
            holds. It cannot be read back — that is the trade, and it is what
            keeps counterparty names out of a table that can never be cleaned.

            Prefixed with the canonicalisation version that produced it, so a
            later change to the canonical form cannot make two incomparable
            digests look comparable.
          examples: ["v1:3f786850e387550fdab836ed7e6dc881de23001b0f6b6be0d38e93d5a3d3d3d3"]
        afterDigest:
          type: string
          description: Digest of the subject after the change.
        correlationId:
          type: string
          description: |
            Joins this event to the log line and to the response the caller
            received.
        occurredAt: { type: string, format: date-time }

    AuditEventList:
      type: object
      required: [auditEvents, count, limit, truncated]
      properties:
        auditEvents:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        count: { type: integer }
        limit: { type: integer, examples: [500] }
        truncated: { type: boolean }

    EvidencePack:
      type: object
      description: |
        Every state change of one subject, in order, with its actor — and the
        pack's own boundaries, so completeness never has to be inferred.
      required: [subjectId, subjectType, from, to, events, count, limit, truncated]
      properties:
        subjectId: { type: string, format: uuid }
        subjectType:
          type: string
          enum: [payment-instruction, approval, organisation, account, journal-entry,
                 settlement-batch, reconciliation-statement, reconciliation-break,
                 reconciliation-adjustment, screening-result, screening-case]
        from:
          type: string
          format: date-time
          description: When the first event in the pack occurred.
        to:
          type: string
          format: date-time
          description: When the last one did.
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        count: { type: integer }
        limit: { type: integer, examples: [500] }
        truncated:
          type: boolean
          description: |
            True when the subject has more events than the cap. Stated on every
            pack: an auditor should never have to infer completeness from the
            absence of a warning.

    ServiceInfo:
      type: object
      required: [service, description, environment, disclaimer, sourceCommit]
      properties:
        service: { type: string, examples: ["clofin-core"] }
        description: { type: string }
        environment:
          type: string
          enum: [dev, test, prod]
        disclaimer:
          type: string
          description: Statement of scope — synthetic data, no institutional connectivity.
        sourceCommit:
          type: string
          pattern: "^([0-9a-f]{40}|unknown)$"
          examples: ["f10974c7762eb9e095694fcfb3aaa72c0bee4bdf", "unknown"]
          description: |
            The commit this process reports itself as running, **self-reported
            by the running process and not attested**. Nothing in this response
            demonstrates that the bytes serving it are the bytes at that
            commit; the field says what the process was told at start-up, or
            what it could read from a source checkout beside it.

            Exactly two forms occur: a 40-character lower-case hex commit id,
            or the literal string `unknown`. There is no third, and in
            particular never a branch name — a value that is not a commit id is
            ignored rather than reported, because a branch name displayed under
            the label "commit" is stable, plausible and wrong.
        instanceId:
          type: string
          examples: ["6f0a9c1e-6a4e-4a1a-9a1d-0d3a2b5c7e91"]
          description: |
            An opaque identifier the operator passed at start-up, echoed
            verbatim. **Self-reported like `sourceCommit`**, and absent when
            none was passed — there is no placeholder, because a caller that
            passed nothing must not receive a string that looks like an answer.

            It carries no meaning to CloFin: the service does not parse it,
            generate one, or refuse a value. Its use is a caller that started
            this process and wants to establish that the process answering is
            the one it started, which a port and a schema version cannot show.
        documentation: { type: string, format: uri }

    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service: { type: string }
        uptimeSeconds: { type: integer, format: int64 }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready]
        checks:
          type: object
          description: |
            One entry per dependency this build checks. `ok` is the only value,
            because readiness here is binary: a dependency that is not `ok`
            makes the service not ready, and a not-ready service answers `503`
            with a problem document rather than a `Readiness` with a failed
            check inside it.

            The enum declared `failed` until 2026-09-06 and nothing could ever
            emit it (release-audit finding **2C-010**) — a contract admitting a
            value the system cannot produce, which is standing lesson **L-14**
            with the sign reversed. It comes back the day a check exists that
            can fail without making the service unready, and not before.
          additionalProperties:
            type: string
            enum: [ok]
        schemaVersion:
          type: string
          description: Highest applied migration version, or "none".
          examples: ["0002"]

    Problem:
      type: object
      description: |
        RFC 9457 problem details. Payment APIs are consumed by systems that
        must branch on failure, so `type` is a stable URI that never changes
        meaning; `title` and `detail` are for humans and may be reworded.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ["https://clofin.dev/problems/validation"]
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance:
          type: string
          description: Correlation id — quote this when reporting a failure.
        errors:
          type: object
          description: Structured, machine-readable detail about what failed.
          additionalProperties: true

  headers:
    IdempotentReplayed:
      description: |
        `true` when this response was replayed from a stored one rather than
        produced by new work. Present only on a replay, so someone reconciling
        a retry can see that CloFin replayed rather than acted.
      schema:
        type: string
        enum: ["true"]

    XCorrelationId:
      description: |
        Correlation id echoed on every response. A caller-supplied value is
        honoured so that a trace survives across system boundaries; it is
        sanitised and length-limited before being echoed or logged.
      schema:
        type: string
        maxLength: 128
